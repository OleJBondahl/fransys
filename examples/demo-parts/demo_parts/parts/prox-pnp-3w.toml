schema = 2

[part]
mpn = "DEMO-PROX-PNP"
manufacturer = "Demo"
description = "Inductive proximity sensor, PNP make, 3-wire, 24 V DC, M12 plug"
category = "generic"
class_code = "B"

[[function]]
name = "power"
kind = "load"
ports = [
    { name = "1", role = "generic", side = "line", conductor = "L+" },
    { name = "3", role = "generic", side = "load", conductor = "L-" },
]

[function.operating]
voltage = [{ nom = "24 V", at = ["DC"] }]
nominal_current = "0.01 A"

[[function]]
name = "out"
kind = "sensor"
ports = [{ name = "4", role = "generic", side = "load" }]
