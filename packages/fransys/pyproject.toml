[project]
name = "fransys"
version = "0.13.5"
description = "Fransys facade: pipeline, findings policy, file writing, CLI."
requires-python = ">=3.15"
dependencies = [
    "fransys-model @ git+https://github.com/OleJBondahl/fransys@v0.13.5#subdirectory=packages/fransys-model",
    "fransys-parts @ git+https://github.com/OleJBondahl/fransys@v0.13.5#subdirectory=packages/fransys-parts",
    "fransys-author @ git+https://github.com/OleJBondahl/fransys@v0.13.5#subdirectory=packages/fransys-author",
    "fransys-layout @ git+https://github.com/OleJBondahl/fransys@v0.13.5#subdirectory=packages/fransys-layout",
    "fransys-render @ git+https://github.com/OleJBondahl/fransys@v0.13.5#subdirectory=packages/fransys-render",
    "fransys-reports @ git+https://github.com/OleJBondahl/fransys@v0.13.5#subdirectory=packages/fransys-reports",
    "fransys-pdf @ git+https://github.com/OleJBondahl/fransys@v0.13.5#subdirectory=packages/fransys-pdf",
    "fransys-kicad @ git+https://github.com/OleJBondahl/fransys@v0.13.5#subdirectory=packages/fransys-kicad",
    "fransys-wago @ git+https://github.com/OleJBondahl/fransys@v0.13.5#subdirectory=packages/fransys-wago",
    "fransys-overview @ git+https://github.com/OleJBondahl/fransys@v0.13.5#subdirectory=packages/fransys-overview",
    "typst==0.15.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fransys"]
