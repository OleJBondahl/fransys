<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System overview</title>
<style>
:root { --bg: #ffffff; --fg: #1c2b39; --muted: #5b6b7a; --panel: #f4f6f8; --border: #c3ccd5;
  --accent: #d9480f; --line: #4b5966; }
:root[data-theme="dark"] { --bg: #262b33; --fg: #e6ebf0; --muted: #a3afbb; --panel: #2e343d;
  --border: #46505c; --accent: #ff9a5c; --line: #b4bfca; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #262b33; --fg: #e6ebf0; --muted: #a3afbb;
    --panel: #2e343d; --border: #46505c; --accent: #ff9a5c; --line: #b4bfca; }
}
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
  font: 14px/1.4 system-ui, sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 12px;
  background: var(--panel); border-bottom: 1px solid var(--border); }
h1 { margin: 0; font-size: 17px; }
label.pick { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
select, input, button { background: var(--bg); color: var(--fg); border: 1px solid var(--border);
  border-radius: 3px; padding: 3px 6px; font: inherit; }
button { cursor: pointer; }
#features { position: relative; font-size: 12px; }
#features summary { cursor: pointer; }
#feat-body { position: absolute; z-index: 6; top: 100%; left: 0; min-width: 200px;
  padding: 6px 10px;
  background: var(--bg); border: 1px solid var(--border); }
#feat-body label { display: block; white-space: nowrap; }
#feat-body fieldset { margin: 6px 0 0; padding: 2px 6px; border: 1px solid var(--border); }
input[type="checkbox"]:disabled { appearance: none; width: 12px; height: 12px; margin: 0 4px 0 0;
  padding: 0; border: 1px solid var(--muted); border-radius: 2px; background: var(--panel);
  opacity: 0.6; cursor: not-allowed; }
input[type="checkbox"]:disabled:checked { background: var(--muted);
  box-shadow: inset 0 0 0 2px var(--panel); }
#find { position: relative; }
#search { width: 220px; }
#hits { position: absolute; z-index: 5; left: 0; right: 0; margin: 0; padding: 0; list-style: none;
  background: var(--bg); border: 1px solid var(--border); max-height: 240px; overflow: auto; }
#hits:empty { display: none; }
#hits li { padding: 3px 8px; cursor: pointer; }
#hits li:hover, #hits li[aria-selected="true"] { background: var(--panel); }
#bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 4px 12px;
  border-bottom: 1px solid var(--border); font-size: 12px; }
#crumbs button { border: 0; background: none; color: var(--accent); padding: 0 2px; }
#crumbs span.here { font-weight: 600; }
.chip { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--border);
  border-radius: 10px; padding: 0 8px; background: var(--panel); }
.chip button { border: 0; background: none; padding: 0; }
main { display: flex; flex: 1; min-height: 0; }
#tree { width: 230px; overflow: auto; padding: 6px 8px; border-right: 1px solid var(--border);
  background: var(--panel); font-size: 12px; }
#tree ul { list-style: none; margin: 0; padding-left: 14px; }
#tree summary { cursor: pointer; }
#stage { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 4px 12px; font-size: 12px; }
#legend[hidden] { display: none; }
#legend button { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none;
  padding: 0 2px; }
#legend button.off { opacity: 0.4; text-decoration: line-through; }
#legend i { display: inline-block; width: 12px; height: 12px; border: 2px solid;
  border-radius: 2px; }
#cy { flex: 1; min-height: 0; }
#alt { flex: 1; min-height: 0; overflow: auto; padding: 8px 12px; }
#alt[hidden] { display: none; }
#alt h2 { margin: 12px 0 6px; font-size: 14px; }
#alt table { border-collapse: collapse; font-size: 12px; }
#alt th, #alt td { border: 1px solid var(--border); padding: 2px 6px; text-align: left; }
#alt td button { width: 100%; }
#alt td.cell { text-align: center; }
#alt ul { margin: 0; padding-left: 18px; }
#detail { width: 280px; overflow: auto; padding: 8px 12px; border-left: 1px solid var(--border);
  background: var(--panel); font-size: 12px; }
#detail h2 { margin: 0 0 6px; font-size: 14px; }
#detail p { margin: 0 0 6px; }
#members { margin: 0; padding: 0; list-style: none; }
#members button { width: 100%; text-align: left; margin-bottom: 2px; }
#opens button { margin: 0 4px 4px 0; }
.sr { position: absolute; left: -9999px; }
@media print {
  header, #bar, #tree, #detail, #legend, #features { display: none; }
  #cy { height: 100vh; }
}
</style>
</head>
<body>
<header>
<h1>System overview</h1>
<div id="find"><input id="search" type="search" role="combobox" aria-expanded="false"
  aria-controls="hits" placeholder="Find an item by designation"
  aria-label="Find an item by designation" autocomplete="off">
<ul id="hits" role="listbox"></ul></div>
<label class="pick">Colour by <select id="split"></select></label>
<label class="pick">View <select id="mode"></select></label>
<label class="pick">Theme <select id="theme"><option value="system">System</option>
<option value="light">Light</option><option value="dark">Dark</option></select></label>
<details id="features"><summary>Features</summary><div id="feat-body"></div></details>
<button id="up" type="button">Up one level</button>
<button id="png" type="button">Save PNG</button>
</header>
<div id="bar"><nav id="crumbs" aria-label="Levels"></nav><span id="opens"></span>
<span id="chips"></span></div>
<main>
<aside id="tree" aria-label="Parts"></aside>
<div id="stage"><div id="legend" aria-label="Legend"></div><div id="cy"></div>
<div id="alt" hidden></div></div>
<aside id="detail" aria-live="polite"></aside>
</main>

<script>'use strict';
(function () {
const data = JSON.parse(document.getElementById('overview-data').textContent);
const $ = (id) => document.getElementById(id);
const SPLITS = [['none', 'Nothing'], ['unit', 'Unit'], ['group', 'Function group'],
  ['kind', 'Item kind'], ['location', 'Location']];
const SPLIT_AT = { unit: 0, group: 1, kind: 2, location: 3 };
const ORDER = { unit: ['groups', 'see_through', 'plain', 'lanes'], system: ['plain', 'location', 'fields'],
  group: ['see_through'] };
const MODE_NAME = { groups: 'Function groups', see_through: 'All devices', plain: 'Plain',
  lanes: 'Lanes', location: 'By location', fields: 'Field devices folded' };

const state = { unit: null, level: null, mode: 'plain', open: null, split: 'none',
  hidden: new Set(), off: new Set(), sel: null, cell: null, theme: 'system',
  feat: { zoom: false, matrix: false, signals: false, locfold: false, focus: false, k: 1,
    findings: false, changes: false, changesonly: false } };

/* An open box is its reference, then for a stub the reference of the box it hangs on (O24). */
const oneKey = (ref) => ref[0] + '.' + (ref[1] ?? '');
const refKey = (ref) => (ref === null ? '-' : oneKey(ref) + (ref.length > 2 ? '@' + oneKey(ref.slice(2)) : ''));
const keyOf = (unit, level, mode, open) => [unit ?? '', refKey(level), mode, refKey(open)].join('|');
const views = new Map(data.views.map((view) => [keyOf(view.unit, view.level, view.mode, view.open), view]));
/* A strip is a recorded view. A fold is a box of the closed view whose members the details panel
   lists, so it has no view of its own (B2). `state.open` holds either; one at a time. */
const shownOpen = () => (hasView(state.unit, state.level, state.mode, state.open) ? state.open : null);
const current = () => views.get(keyOf(state.unit, state.level, state.mode, shownOpen()));
const openOf = (box) => (box.at === null ? box.ref : [...box.ref, ...box.at]);
const foldBoxes = () => (views.get(keyOf(state.unit, state.level, state.mode, null))?.boxes ?? [])
  .filter((box) => box.members.length > 0);
const openFold = () => (state.open === null ? null
  : foldBoxes().find((box) => sameRef(openOf(box), state.open)) ?? null);
const hasView = (unit, level, mode, open) => views.has(keyOf(unit, level, mode, open));

/* The label a reference prints: the first text line of the first box that stands for it, its
   place box first, else its first stub (a folded field box has no place box of its own). */
const refLabels = new Map();
const stubLabels = new Map();
for (const view of data.views) {
  for (const box of view.boxes) {
    const key = oneKey(box.ref);
    if (box.at === null && !refLabels.has(key)) refLabels.set(key, box.lines[0] ?? '');
    if (box.at !== null && !stubLabels.has(key)) stubLabels.set(key, box.lines[0] ?? '');
  }
}
const plainLabel = (ref) => refLabels.get(oneKey(ref)) ?? stubLabels.get(oneKey(ref)) ?? refKey(ref);
const labelOf = (ref) => plainLabel(ref) + (ref.length > 2 ? ' on ' + plainLabel(ref.slice(2)) : '');

const levelKind = (unit, level) => (unit === null ? 'system' : level === null ? 'unit' : 'group');
const modesOf = (unit, level) =>
  ORDER[levelKind(unit, level)].filter((mode) => hasView(unit, level, mode, null));

const settle = () => {
  if (!hasView(state.unit, state.level, state.mode, state.open) && openFold() === null) state.open = null;
  if (!hasView(state.unit, state.level, state.mode, null)) state.mode = modesOf(state.unit, state.level)[0] ?? 'plain';
  /* On the system level the Location fold switch and the 'location' mode are one fact (O9). */
  if (levelKind(state.unit, state.level) === 'system' && hasView(null, null, 'location', null)) state.feat.locfold = state.mode === 'location';
};

/* Go to a level, in its first mode (the unit view's default is the function groups). */
const go = (unit, level, mode = null, open = null) => {
  state.unit = unit;
  state.level = level;
  const wantsPlaces = unit === null && state.feat.locfold && hasView(null, null, 'location', null);
  state.mode = mode ?? (wantsPlaces ? 'location' : modesOf(unit, level)[0] ?? 'plain');
  state.open = open;
  state.sel = null;
  settle();
};

/* The levels above the one shown, outermost first, as [label, unit, level]. */
const trail = () => {
  const up = [];
  for (let at = state.unit; at !== null; at = data.unit_parents[at]) up.unshift(at);
  const list = [['System', null, null], ...up.map((u) => [data.units[u], u, null])];
  if (state.level !== null) list.push([labelOf(state.level), state.unit, state.level]);
  return list;
};

const parentLevel = () => {
  const list = trail();
  return list.length > 1 ? list[list.length - 2] : null;
};

/* What a box opens: a unit its level, a function group or the strips box its level, a strip its
   terminals in place, a fold its member list in the panel (O1, O5, O14). A place box opens nothing. */
const target = (box) => {
  const [kind, index] = box.ref;
  if (box.members.length > 0) {
    const open = openOf(box);
    return foldBoxes().some((b) => sameRef(openOf(b), open)) ? { open, fold: true } : null;
  }
  if (box.at !== null) {
    const open = [...box.ref, ...box.at];
    return hasView(state.unit, state.level, state.mode, open) ? { open } : null;
  }
  if (kind === 'unit' && hasView(index, null, modesOf(index, null)[0] ?? 'plain', null)) return { unit: index };
  if (kind === 'group' || kind === 'strips') return { unit: state.unit, level: box.ref };
  if (kind === 'fields' || kind === 'item') {
    return hasView(state.unit, state.level, state.mode, box.ref) ? { open: box.ref } : null;
  }

};

/* Null when the box opens nothing, else whether the view refits: a fold never moves it (A13). */
const enter = (box) => {
  const next = target(box);
  if (next === null) return null;
  if (!('open' in next)) { go(next.unit, next.level ?? null); return true; }
  const was = shownOpen();
  state.open = sameRef(state.open, next.open) ? null : next.open;
  state.sel = null;
  return !(next.fold === true && was === null);
};
const sameRef = (a, b) => refKey(a) === refKey(b);

/* The URL hash holds the whole view, so Back and Forward walk it (O23). Ids never reach it. */
const encode = () => {
  const p = new URLSearchParams();
  p.set('u', state.unit ?? '');
  p.set('l', state.level === null ? '' : refKey(state.level));
  p.set('m', state.mode);
  p.set('o', state.open === null ? '' : refKey(state.open));
  p.set('c', state.split);
  p.set('h', [...state.hidden].join(','));
  p.set('i', [...state.off].join(','));
  p.set('s', state.sel ?? '');
  p.set('f', Object.keys(state.feat).filter((id) => state.feat[id] === true).map((id) => (id === 'changesonly' ? 'changes.only' : id)).join(','));

};

  const parts = text.split('.');
  return parts.length === 2 ? [parts[0], parts[1] === '' ? null : Number(parts[1])] : null;

  const [head, tail = null] = (text ?? '').split('@');

const decode = (text) => {
  const p = new URLSearchParams(text);
  state.unit = num(p.get('u'));
  state.level = parseRef(p.get('l'));
  state.mode = p.get('m') ?? 'plain';
  state.open = parseRef(p.get('o'));
  state.split = p.get('c') ?? 'none';
  state.hidden = new Set((p.get('h') ?? '').split(',').filter((x) => x !== ''));
  state.off = new Set((p.get('i') ?? '').split(',').filter((x) => x !== '').map(Number));
  state.sel = p.get('s') === '' ? null : p.get('s');
  const on = new Set((p.get('f') ?? '').split(','));
  for (const id of Object.keys(state.feat)) if (id !== 'k') state.feat[id] = on.has(id);
  state.feat.changesonly = on.has('changes.only');
  state.feat.k = [1, 2, 3].includes(Number(p.get('k'))) ? Number(p.get('k')) : 1;
  settle();
};

const hasChanges = data.changes !== null;
const changesOn = () => hasChanges && state.feat.changes;

/* The marks of a view, by box and by line; empty while the switch is off. */
const marksOf = (view) => {
  const rows = changesOn() ? data.changes.views[data.views.indexOf(view)] : [[], []];
  return { boxes: new Map(rows[0]), lines: new Map(rows[1]) };
};

/* "Changes only": the marked boxes, and the ends of the marked lines; `null` when not filtering. */
const changeKeep = (view) => {
  if (!changesOn() || !state.feat.changesonly) return null;
  const marks = marksOf(view);
  const boxes = new Set(marks.boxes.keys());
  for (const at of marks.lines.keys()) { boxes.add(view.lines[at].a); boxes.add(view.lines[at].b); }
  return { boxes, lines: new Set(marks.lines.keys()) };
};

const markChanges = (view, els) => {
  const marks = marksOf(view);
  for (const one of els) {
    const d = one.data;
    const kind = d.role === 'box' ? marks.boxes.get(d.box) : d.role === 'line' ? marks.lines.get(d.line) : undefined;
    if (kind === undefined) continue;
    d.chg = kind;
  }
  return els;
};

const CHANGE_STYLE = [
  { selector: 'node[chg="added"]', style: { 'border-color': '#2e7d32', 'border-width': 4 } },
  { selector: 'node[chg="changed"]', style: { 'border-color': '#e69500', 'border-width': 4 } },
  { selector: 'edge[chg="added"]', style: { 'line-color': '#2e7d32', width: 4 } },
  { selector: 'edge[chg="changed"]', style: { 'line-color': '#e69500', width: 4 } },
];

/* While the switch is on, the legend names the marks: colour and border, never a text prefix. */
const legendChanges = () => {
  if (!changesOn()) return;
  $('legend').append(el('span', 'Changes: green border added, orange border changed.'));
};

/* The things no box carries (removed ones, and any with no box on a view): one group per kind. */
const drawRemoved = () => {
  if (!changesOn()) return;
  const rest = data.changes.rest;
  $('detail').append(el('h3', 'Since ' + data.changes.since));
  if (rest.length === 0) $('detail').append(el('p', 'Every change is on a box or a line.'));
  for (const [kind, name] of [['removed', 'Removed'], ['added', 'Added'], ['changed', 'Changed']]) {
    const group = rest.filter((r) => r[0] === kind);
    if (group.length === 0) continue;
    const list = el('ul', '', { id: 'changes-' + kind });
    list.append(...group.map((r) => el('li', r[1])));
    $('detail').append(el('h4', name + ' (' + group.length + ')'), list);
  }

const th = data.text_height;
const K = 13 / th;
const dark = () => document.documentElement.getAttribute('data-theme') === 'dark'
  || (document.documentElement.getAttribute('data-theme') !== 'light'
    && window.matchMedia('(prefers-color-scheme: dark)').matches);
const tone = () => (dark() ? 'dark' : 'light');
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* One class value per colour split; the hue of a class is its place in the sorted classes. */
const classesOf = (split) => {
  const found = new Set();
  for (const view of data.views) for (const box of view.boxes) found.add(box.cls[SPLIT_AT[split]]);
  found.delete(null);
  return [...found].sort((a, b) => a.localeCompare(b, 'en', { numeric: true }));
};

  if (split === 'none' || cls === null) return data.palette.neutral[tone()];
  const hues = data.palette.hues;

  const cls = state.split === 'none' ? null : box.cls[SPLIT_AT[state.split]];
  return cls !== null && state.hidden.has(classKey(cls));
};

const FONT = th * K;
const boxNode = (box, i) => ({
  group: 'nodes',
  data: { id: 'b' + i, role: 'box', box: i, label: box.lines.join('\n'), w: box.w * K, h: box.h * K,
    stroke: hueOf(state.split, state.split === 'none' ? null : box.cls[SPLIT_AT[state.split]]),
    dashed: box.dashed, stub: box.at !== null,
    open: state.open !== null && box.members.length > 0 && sameRef(openOf(box), state.open) },
  position: { x: (box.x + box.w / 2) * K, y: (box.y + box.h / 2) * K },
});
const tabNodes = (box, i) => box.tabs.map((tab, j) => ({
  group: 'nodes',
  data: { id: 't' + i + '_' + j, role: 'tab', box: i, label: tab[3] ?? '',
    w: (tab[2] + th) * K, h: (th * 2) * K },
  position: { x: (tab[0] + (tab[2] + th) / 2) * K, y: (tab[1] + th) * K },
}));
const lineNodes = (line, i) => {
  const nodes = line.pts.map((p, k) => ({
    group: 'nodes', data: { id: 'p' + i + '_' + k, role: 'pt', line: i },
    position: { x: p[0] * K, y: p[1] * K } }));
  const edges = line.pts.slice(1).map((_, k) => ({
    group: 'edges', data: { id: 'e' + i + '_' + k, role: 'line', line: i, kind: line.kind,
      source: 'p' + i + '_' + k, target: 'p' + i + '_' + (k + 1) } }));
  const label = line.text === '' ? [] : [{ group: 'nodes',
    data: { id: 'l' + i, role: 'text', line: i, label: line.text },
    position: { x: line.tx * K, y: line.ty * K } }];
  return [...nodes, ...edges, ...label];

/* O18: a badge by severity on each box and line a finding names (worst severity, count). */
const BADGE = { error: "#c62828", warning: "#e69500", info: "#1e6fd0" };

  data: { id, role: "badge", label: String(flag[2]), w: badgeW(String(flag[2])),
    color: BADGE[flag[1]], ...extra },
  position: { x: at[0] * K, y: at[1] * K } });
const badgesOf = (view, shown) => {
  const on = state.feat.findings && hasFindings;
  const rows = on ? data.findings[data.views.indexOf(view)] : [[], []];
  const boxes = rows[0].filter((f) => shown.has(f[0])).map((f) => {
    const box = view.boxes[f[0]];
    return badgeNode("fb" + f[0], [box.x + box.w, box.y], f, { box: f[0] });
  });
  const drawn = (f) => shown.has(view.lines[f[0]].a) && shown.has(view.lines[f[0]].b);
  const lines = rows[1].filter(drawn).map((f) => {
    const pts = view.lines[f[0]].pts;
    return badgeNode("fl" + f[0], pts[Math.floor(pts.length / 2)], f, { line: f[0] });
  });
  return [...boxes, ...lines];
};

/* O4: a lane's text, drawn from its recorded corner; the label hangs right. */
const headNodes = (view) => view.heads.map((h, i) => ({
  group: 'nodes', data: { id: 'h' + i, role: 'head', label: h[0] },
  position: { x: h[1] * K, y: (h[2] + th / 2) * K } }));

const elementsOf = (view) => {
  const shown = new Set();
  const els = [];
  const keep = changeKeep(view);
  view.boxes.forEach((box, i) => {
    if (boxHidden(box) || (keep !== null && !keep.boxes.has(i))) return;
    shown.add(i);
    els.push(boxNode(box, i), ...tabNodes(box, i));
  });
  view.lines.forEach((line, i) => {
    const wanted = keep === null || keep.lines.has(i);
    if (shown.has(line.a) && shown.has(line.b) && wanted) els.push(...lineNodes(line, i));
  });
  els.push(...headNodes(view), ...badgesOf(view, shown));
  return markChanges(view, els);
};

const el = (tag, content = '', attrs = {}) => {

  return node;
};
const button = (content, onclick, attrs = {}) => {

  return node;
};
let commit = () => {};

const drawCrumbs = () => {
  const list = trail();
  const kids = [];
  list.forEach((crumb, n) => {
    if (n > 0) kids.push(document.createTextNode(' / '));
    if (n === list.length - 1) kids.push(el('span', crumb[0], { class: 'here' }));
    else kids.push(button(crumb[0], () => { go(crumb[1], crumb[2]); commit(true); }));

const drawPickers = () => {

/* The boxes of the level shown that sit in each class of the chosen split. */
const countClasses = (view) => {

};

const drawLegend = (view) => {
  if (state.split === 'none') {

const drawChips = () => {

const drawOpens = () => {

    && v.mode === state.mode && v.open !== null).map((v) => v.open);

const facts = (item) => {
  const out = ['Kind: ' + item.kind];
  if (item.unit !== null) out.push('Unit: ' + data.units[item.unit]);
  if (item.location !== null) out.push('Location: ' + item.location);
  if (item.group !== null) out.push('Function group: ' + item.group);
  if (item.mpn !== null) out.push('Part: ' + item.mpn);
  if (!item.installed) out.push('Not installed');
  return out;
};

const signalsOf = (index) => {
  const found = data.signals.filter((s) => s.some((p) => p[0] === index));
  const lines = found.length === 0 ? [] : [found.length + ' signal(s) through here'];
  for (const s of found.slice(0, 12)) {
    const shown = s.slice(0, 6).map((p) => data.items[p[0]].label + ' (' + p[1] + ')').join('  -  ');
    lines.push(s.length > 6 ? shown + '  ... ' + (s.length - 6) + ' more' : shown);
  }

};

const pageLinks = (index) => {

  const links = pages.map(([href, text]) => el('a', text, { href, class: 'page' }));

/* O18: the codes the selected box or line holds with a count each, worst severity first. */
const drawFindings = (view, which, at) => {
  if (!(state.feat.findings && hasFindings)) return;
  const flag = data.findings[data.views.indexOf(view)][which].find((f) => f[0] === at);
  if (flag === undefined) return;
  const list = el('ul', '', { id: 'findings' });
  list.append(...flag[3].map((r) => el('li', r[1] + ' (' + r[0] + ') x ' + r[2])));
  const total = flag[3].reduce((n, r) => n + r[2], 0);

};

const drawDetail = (view) => {
  if (state.feat.matrix && state.cell !== null) { drawCell(); return; }
  const fold = openFold();
  if (fold !== null && (state.sel === null || state.sel === 'b' + view.boxes.indexOf(fold))) {
    drawFold(fold);
    return;
  }
  if (state.sel === null && altOn()) {
    detail(state.feat.matrix ? 'Matrix' : 'Signals',
      [state.feat.matrix ? 'Click a count to list its cables.' : 'Click a module or a field device to find it.']);
    return;
  }
  if (state.sel === null) {
    detail(view.boxes.length + ' boxes, ' + view.lines.length + ' lines',
      ['Click a box or a line to trace its connections. Double-click a box, or press Enter, to open it.']);
    return;
  }
  const at = Number(state.sel.slice(1));
  if (state.sel[0] === 'l') {
    const line = view.lines[at];
    detail((line.text === '' ? line.kind : line.text) + ' (' + line.kind + ')',
      [view.boxes[line.a].lines[0] + ' - ' + view.boxes[line.b].lines[0]]);
    drawFindings(view, 1, at);
    return;
  }
  const box = view.boxes[at];
  const own = box.ref[0] === 'item' ? data.items[box.ref[1]] : null;
  detail(box.lines[0], [...box.lines.slice(1), ...(own === null ? [] : facts(own)),
    ...(own === null ? [] : signalsOf(box.ref[1]))], own === null ? null : box.ref[1]);
  drawHolds(box);

};

/* The parts tree (O12): units, then their items, strips last, as `derive.overview_tree` gives the
   rows. Each item has a show box. Children are built when a node is opened, so a large plant
   costs nothing until it is read. */
const kidsOf = new Map();
data.tree.forEach((row, i) => {
  const key = row.parent === null ? -1 : row.parent;
  if (!kidsOf.has(key)) kidsOf.set(key, []);
  kidsOf.get(key).push(i);
});
const treeName = (row) => {
  if (!row.is_unit) return button(row.label, () => locate(row.item));
  if (row.unit === null) return el('span', row.label);
  return button(row.label, () => { go(row.unit, null); commit(true); });
};
const treeNode = (r) => {
  const row = data.tree[r];
  const head = [];
  if (!row.is_unit) {
    const box = el('input', '', { type: 'checkbox', 'aria-label': 'Show ' + row.label });
    box.checked = !state.off.has(row.item);
    box.addEventListener('change', () => {
      if (box.checked) state.off.delete(row.item); else state.off.add(row.item);
      commit(false);
    });
    head.push(box);
  }
  head.push(treeName(row));
  const kids = kidsOf.get(r);
  if (kids === undefined) { const leaf = el('li'); leaf.append(...head); return leaf; }
  const node = el('details');
  const summary = el('summary');
  summary.append(...head);
  node.append(summary);
  node.addEventListener('toggle', () => {
    if (node.open && node.querySelector('ul') === null) {
      const list = el('ul');
      list.append(...kids.map((k) => { const li = el('li'); li.append(treeNode(k)); return li; }));
      node.append(list);
    }
  });
  return node;
};
const drawTree = () => {
  const list = el('ul');
  list.append(...(kidsOf.get(-1) ?? []).map((i) => { const li = el('li'); li.append(treeNode(i)); return li; }));
  $('tree').replaceChildren(list);
};

/* Where an item is drawn: the smallest level that holds its box, else a view that opens it. */
const placeOf = (item) => {
  const holds = (v) => v.boxes.some((b) => b.at === null && b.ref[0] === 'item' && b.ref[1] === item);
  const plain = data.views.filter((v) => v.open === null && holds(v));
  const pool = plain.length > 0 ? plain : data.views.filter(holds);
  return pool.reduce((best, v) => (best === null || v.boxes.length < best.boxes.length ? v : best), null);
};
const locate = (item) => {
  const view = placeOf(item);
  if (view === null) { detail(data.items[item].label, ['Not drawn on any level.']); return; }
  go(view.unit, view.level, view.mode, view.open);
  state.sel = 'b' + view.boxes.findIndex((b) => b.at === null && b.ref[0] === 'item' && b.ref[1] === item);
  commit(true);
};

const hitsFor = (query) => {
  const q = query.trim().toLowerCase();
  if (q === '') return [];
  const found = data.items.map((item, i) => [item.label.toLowerCase(), i]).filter(([text]) => text.includes(q));
  found.sort((a, b) => (a[0].startsWith(q) ? 0 : 1) - (b[0].startsWith(q) ? 0 : 1));
  return found.slice(0, 10).map(([, i]) => i);
};
const drawHits = () => {
  const hits = hitsFor($('search').value);
  $('hits').replaceChildren(...hits.map((i, n) => {
    const row = el('li', data.items[i].label, { role: 'option', 'aria-selected': String(n === 0) });
    row.addEventListener('mousedown', (event) => { event.preventDefault(); locate(i); $('search').value = ''; drawHits(); });
    return row;
  }));
  $('search').setAttribute('aria-expanded', String(hits.length > 0));
};

/* A place box's members under its title: a unit opens its level, an item in no unit is found. */
const drawHolds = (box) => {
  const held = box.holds ?? [];
  if (held.length === 0) return;
  const list = el('ul', '', { id: 'members' });
  list.append(...held.map(([ref, label]) => {
    const row = el('li');
    const open = () => { if (ref[0] === 'unit') { go(ref[1], null); commit(true); } else locate(ref[1]); };
    row.append(button(label, open));
    return row;
  }));
  $('detail').append(list);
};

/* The switch was set: the system level follows it, to the location view or back to plain. */
const pickLocFold = () => {
  if (levelKind(state.unit, state.level) !== 'system' || !hasView(null, null, 'location', null)) return;
  state.mode = state.feat.locfold ? 'location' : 'plain';
  state.open = null;
  state.sel = null;
};

const ZOOM_FROM = 160;
const ZOOM_FULL = 360;
const ZOOM_FILL = 0.88;

/* The view a box opens, by the box's own level: a unit its level, a group or strips box its level. */
const childViewOf = (view, box) => {
  if (box.at !== null || box.members.length > 0) return undefined;
  const [kind, index] = box.ref;
  const [unit, level] = kind === 'unit' ? [index, null] : kind === 'group' || kind === 'strips' ? [view.unit, box.ref] : [null, undefined];
  if (level === undefined) return undefined;
  const mode = modesOf(unit, level)[0];
  return mode === undefined ? undefined : views.get(keyOf(unit, level, mode, null));
};
const hasZoom = data.views.some((view) => view.open === null && view.boxes.some((box) => childViewOf(view, box) !== undefined));
const zoomOn = () => hasZoom && state.feat.zoom && !altOn();

/* Where the child view's bounding box lands inside `box`: [scale, x0, y0] in recorded units. */
const zoomFit = (box, inner) => {
  const xs = inner.boxes.map((b) => b.x);
  const ys = inner.boxes.map((b) => b.y);
  const x1 = Math.max(...inner.boxes.map((b) => b.x + b.w));
  const y1 = Math.max(...inner.boxes.map((b) => b.y + b.h));
  const [x0, y0] = [Math.min(...xs), Math.min(...ys)];
  const s = Math.min(box.w * ZOOM_FILL / (x1 - x0), box.h * ZOOM_FILL / (y1 - y0));
  return { s, at: (x, y) => [box.x + box.w / 2 + (x - (x0 + x1) / 2) * s, box.y + box.h / 2 + (y - (y0 + y1) / 2) * s] };
};

const zoomElements = (i, box, inner) => {
  const fit = zoomFit(box, inner);
  const els = [];
  inner.boxes.forEach((b, j) => {
    const [x, y] = fit.at(b.x + b.w / 2, b.y + b.h / 2);
    els.push({ group: 'nodes', classes: 'zoomed',
      data: { id: 'zb' + i + '_' + j, role: 'zbox', label: b.lines.join('\n'), w: b.w * fit.s * K, h: b.h * fit.s * K,
        fs: Math.max(FONT * fit.s, 0.5), stroke: hueOf(state.split, state.split === 'none' ? null : b.cls[SPLIT_AT[state.split]]) },
      position: { x: x * K, y: y * K } });
  });
  inner.lines.forEach((line, j) => {
    const ids = line.pts.map((p, k) => {
      const [x, y] = fit.at(p[0], p[1]);
      els.push({ group: 'nodes', classes: 'zoomed', data: { id: 'zp' + i + '_' + j + '_' + k, role: 'zpt' }, position: { x: x * K, y: y * K } });
      return 'zp' + i + '_' + j + '_' + k;
    });
    ids.slice(1).forEach((to, k) => els.push({ group: 'edges', classes: 'zoomed',
      data: { id: 'ze' + i + '_' + j + '_' + k, role: 'zline', source: ids[k], target: to } }));
  });
  return els;
};

/* 0 below ZOOM_FROM rendered pixels of box width, 1 from ZOOM_FULL. */
const zoomOpacity = (box) => Math.max(0, Math.min(1, (box.w * K * cy.zoom() - ZOOM_FROM) / (ZOOM_FULL - ZOOM_FROM)));
const zoomSeen = (box) => {
  const e = cy.extent();
  return box.x * K < e.x2 && (box.x + box.w) * K > e.x1 && box.y * K < e.y2 && (box.y + box.h) * K > e.y1;
};

const zoomIn = new Map();
/* Add the inside of each box zoomed in on, fade it by zoom, drop it when the box leaves view or zoom (render clears all). */
const zoomUpdate = (fresh) => {
  if (fresh) zoomIn.clear();
  const view = current();
  if (view === undefined) return;
  cy.batch(() => {
    view.boxes.forEach((box, i) => {
      const op = zoomOn() && cy.getElementById('b' + i).nonempty() ? zoomOpacity(box) : 0;
      const inner = op > 0 && zoomSeen(box) ? childViewOf(view, box) : undefined;
      if (inner === undefined || inner.boxes.length === 0) {
        if (zoomIn.has(i)) { zoomIn.get(i).remove(); zoomIn.delete(i); cy.getElementById('b' + i).removeStyle('text-opacity'); }
        return;
      }
      if (!zoomIn.has(i)) zoomIn.set(i, cy.add(zoomElements(i, box, inner)));
      zoomIn.get(i).style('opacity', op);
      cy.getElementById('b' + i).style('text-opacity', 1 - op);
    });
  });
};
const zoomStyle = () => [
  { selector: 'node[role="zbox"]', style: { shape: 'rectangle', label: 'data(label)', width: 'data(w)', height: 'data(h)',
    'font-size': 'data(fs)', 'font-family': 'system-ui, sans-serif', color: css('--fg'), 'text-wrap': 'wrap',
    'text-valign': 'center', 'text-halign': 'center', 'background-color': 'data(stroke)', 'background-opacity': 0.14,
    'border-width': 1, 'border-color': 'data(stroke)', 'z-index': 5, events: 'no' } },
  { selector: 'node[role="zpt"]', style: { width: 1, height: 1, opacity: 0, events: 'no' } },
  { selector: 'edge[role="zline"]', style: { width: 1, 'line-color': css('--line'), 'z-index': 6, events: 'no' } },

const FEATURES = [['zoom', 'Continuous zoom'], ['matrix', 'Matrix'],

const hasMatrix = data.matrix !== null;
const hasFindings = data.findings !== null;

  && (id !== 'findings' || hasFindings) && (id !== 'changes' || hasChanges));

const switchRow = ([id, name]) => {

/* Show `state` in the panel: the unit view's values exist only on a unit level. */
const syncFeatures = () => {
  const unitLevel = levelKind(state.unit, state.level) === 'unit';
  for (const box of $('feat-body').querySelectorAll('input, select')) {
    const id = box.dataset.switch;
    const mode = box.dataset.unitview;
    if (mode !== undefined) {
      box.disabled = !unitLevel || !hasView(state.unit, state.level, mode, null);
      box.checked = unitLevel && state.mode === mode;
    } else if (id === 'k') {
      box.value = String(state.feat.k);
      box.disabled = !state.feat.focus;
    } else if (id === 'changesonly') {
      box.checked = state.feat.changesonly;
      box.parentElement.hidden = !state.feat.changes;
    } else {
      box.checked = state.feat[id];
      box.disabled = false;
    }
  }
};

$('feat-body').addEventListener('change', (event) => {
  const box = event.target;
  if (box.dataset.unitview !== undefined) {
    state.mode = box.value;
    state.open = null;
    state.sel = null;
    commit(true);
    return;
  }
  if (box.dataset.switch === 'k') state.feat.k = Number(box.value);
  else state.feat[box.dataset.switch] = box.checked;
  if (box.dataset.switch === 'locfold') pickLocFold();
  commit(false);
});
buildFeatures();

/* A selected line starts at both of its boxes; a selected box starts at itself. */
const focusSeeds = (view) => {
  const at = Number(state.sel.slice(1));
  return state.sel[0] === 'l' ? [view.lines[at].a, view.lines[at].b] : [at];
};

/* The hop count of each box from the selection, expanding k rounds over the drawn lines. */
const focusHops = (view) => {
  const drawn = new Set(cy.edges().map((edge) => edge.data('line')));
  const hops = new Map(focusSeeds(view).map((box) => [box, 0]));
  for (let level = 0; level < state.feat.k; level += 1) {
    view.lines.forEach((line, i) => {
      if (!drawn.has(i)) return;
      [[line.a, line.b], [line.b, line.a]].forEach(([near, far]) => {
        if (hops.get(near) === level && !hops.has(far)) hops.set(far, level + 1);
      });
    });
  }
  return hops;
};

/* The sharp boxes and lines: a line is sharp when one of its boxes was expanded (hop below k). */
const focusSharp = (view) => {
  const hops = focusHops(view);
  const lines = new Set();
  view.lines.forEach((line, i) => {
    if ((hops.get(line.a) ?? Infinity) < state.feat.k || (hops.get(line.b) ?? Infinity) < state.feat.k) lines.add(i);
  });
  return { boxes: new Set(hops.keys()), lines };
};

/* Runs after every render: a selection with focus on keeps its neighbourhood sharp and fades the rest (O17). */
const applyFocus = (view) => {
  cy.elements().removeClass('faded');
  if (!state.feat.focus || state.sel === null) return;
  const sharp = focusSharp(view);
  cy.elements().forEach((el) => {
    const box = el.data('box');
    const line = el.data('line');
    const keep = box !== undefined ? sharp.boxes.has(box) : sharp.lines.has(line);
    if (keep) el.removeClass('dim'); else el.addClass('faded');
  });
};

/* The stored matrix has row < col; a count shows in both triangles and picks the stored pair. */
const matrixCell = (m, a, b) => {
  const [row, col] = a < b ? [a, b] : [b, a];
  const found = m.cells.find((c) => c[0] === row && c[1] === col);
  if (found === undefined || a === b) return el('td');
  const key = row + '.' + col;
  const cell = el('td');
  cell.append(button(String(found[2]), () => { state.cell = key; commit(false); },
    { 'aria-pressed': state.cell === key ? 'true' : 'false' }));
  return cell;
};

const drawMatrix = () => {
  const m = data.matrix;
  if (m === null) return [el('p', 'No matrix: the system level has no boxes.')];
  const head = el('tr');
  head.append(el('td'), ...m.axis.map((label) => el('th', label, { scope: 'col' })));
  const rows = m.axis.map((label, a) => {
    const tr = el('tr');
    tr.append(el('th', label, { scope: 'row' }), ...m.axis.map((_, b) => matrixCell(m, a, b)));
    return tr;
  });
  const table = el('table');
  table.append(head, ...rows);
  return [el('h2', 'Unit matrix: cables between each pair'), table];
};

/* The details of the picked cell: its cables, each finding its item when the page holds one. */
const drawCell = () => {
  const m = data.matrix;
  const [row, col] = state.cell.split('.').map(Number);
  const cell = m.cells.find((c) => c[0] === row && c[1] === col);
  detail(m.axis[row] + ' - ' + m.axis[col], [cell[2] + ' cable(s)']);
  const list = el('ul');
  list.append(...cell[3].map(([ix, label]) => {
    const li = el('li');
    li.append(ix === null ? el('span', label) : button(label, () => locate(ix)));
    return li;
  }));
  $('detail').append(list);
};

const KIND_LABEL = { digital_in: 'Digital in', digital_out: 'Digital out', analogue_in: 'Analogue in', analogue_out: 'Analogue out' };

/* A name that finds its item when the page holds one and shows; plain text otherwise. */
const lensName = (text, item) => (item === null || state.off.has(item) ? el('span', text) : button(text, () => locate(item)));

const lensRow = (ch) => {
  const tr = el('tr');
  const device = ch.device === null ? el('span', 'spare') : lensName(ch.device, ch.device_item);
  const cell = el('td');
  cell.append(device);
  tr.append(el('td', String(ch.number)), el('td', KIND_LABEL[ch.kind] ?? ch.kind), el('td', ch.signal ?? ''), cell);
  return tr;
};

const lensModule = (m) => {
  const head = el('tr');
  head.append(...['Channel', 'Kind', 'Signal', 'Field device'].map((t) => el('th', t, { scope: 'col' })));
  const table = el('table');
  table.append(head, ...m.channels.map(lensRow));
  const title = el('h3');
  title.append(lensName(m.designation, m.item));
  return [title, table];
};

const drawLens = () => {
  if (data.lens.length === 0) return [el('p', 'No PLC channels in this model.')];
  const shown = data.lens.filter((m) => m.item === null || !state.off.has(m.item));
  return [el('h2', 'Signals: PLC module, channel, field device'), ...shown.flatMap(lensModule)];
};

const altOn = () => state.feat.matrix || state.feat.signals;
let wasAlt = false;

/* Show the pane when a switch asks for it; a drawing shown again is resized for its container. */
const drawAlt = () => {
  const on = altOn();
  if (!state.feat.matrix) state.cell = null;
  const pane = $('alt');
  pane.hidden = !on;
  $('cy').hidden = on;
  pane.replaceChildren(...(on ? [...(state.feat.matrix ? drawMatrix() : []), ...(state.feat.signals ? drawLens() : [])] : []));
  const back = wasAlt && !on;
  wasAlt = on;
  return back;
};

const cy = cytoscape({ container: $('cy'), elements: [], minZoom: 0.05, maxZoom: 6,
  autounselectify: true, boxSelectionEnabled: false });

const applyTheme = () => {
  const root = document.documentElement;
  if (state.theme === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', state.theme);
};
try { state.theme = localStorage.getItem('overview-theme') ?? 'system'; } catch (error) { state.theme = 'system'; }

/* The connections of the selected box or line stay sharp on the level shown; the rest dims. */
const trace = (view) => {
  cy.elements().removeClass('dim hi');
  if (state.sel === null) return;
  const at = Number(state.sel.slice(1));
  const lit = new Set();
  const edges = new Set();
  view.lines.forEach((line, i) => {
    const mine = state.sel[0] === 'l' ? i === at : line.a === at || line.b === at;
    if (!mine) return;
    edges.add(i);
    lit.add(line.a);
    lit.add(line.b);
  });
  if (state.sel[0] === 'b') lit.add(at);
  cy.elements().addClass('dim');
  cy.nodes().forEach((node) => {
    const own = node.data('box');
    const line = node.data('line');
    if ((own !== undefined && lit.has(own)) || (line !== undefined && edges.has(line))) node.removeClass('dim');
    if (own === at && state.sel[0] === 'b') node.addClass('hi');
  });
  cy.edges().forEach((edge) => {
    if (edges.has(edge.data('line'))) edge.removeClass('dim').addClass('hi');
  });
};

/* An open strip or stub (O5, O24): the boxes that appear only when it opens, and the boxes their
   lines join, with the lines of those boxes (`lines`, by index). Null for a closed view and for
   a field box, which fit as the whole view. */
const stripSet = (view) => {
  if (view.open === null || (view.open[0] !== 'item' && view.open.length < 3)) return null;
  const closed = views.get(keyOf(view.unit, view.level, view.mode, null));
  const shut = (box) => sameRef(box.ref, view.open.slice(0, 2))
    && (view.open.length > 2 ? box.at !== null && sameRef(box.at, view.open.slice(2)) : box.at === null);
  if (closed === undefined || !closed.boxes.some(shut)) return null;
  const was = new Set(closed.boxes.map((box) => refKey(box.ref) + '@' + box.at));
  const terminals = new Set();
  view.boxes.forEach((box, i) => { if (!was.has(refKey(box.ref) + '@' + box.at)) terminals.add(i); });
  const boxes = new Set(terminals);
  const lines = new Set();
  view.lines.forEach((line, i) => {
    if (terminals.has(line.a) || terminals.has(line.b)) lines.add(i);
    if (terminals.has(line.a)) boxes.add(line.b);
    if (terminals.has(line.b)) boxes.add(line.a);
  });
  return terminals.size === 0 ? null : { boxes, lines };
};

// Fitting never zooms in past 100 % (O1): a small view stays at true size, centred.
const fitView = () => {
  const view = current();
  const strip = view === undefined ? null : stripSet(view);
  const nodes = strip === null ? undefined : cy.nodes().filter((node) => strip.boxes.has(node.data('box'))
    || (node.data('role') === 'pt' && strip.lines.has(node.data('line'))));
  cy.fit(nodes, 30);
  if (cy.zoom() > 1) { cy.zoom(1); cy.center(nodes); }
  return { zoom: cy.zoom(), pan: { ...cy.pan() } };
};

/* With nothing selected, an open strip dims what its fit set does not hold, as trace() dims the rest. */
const dimOutsideStrip = (view) => {
  const strip = state.sel === null ? stripSet(view) : null;
  if (strip === null) return;
  cy.elements().forEach((el) => {
    const own = el.data('box');
    const line = el.data('line');
    let keep = true;
    if (own !== undefined) keep = strip.boxes.has(own);
    else if (line !== undefined) keep = strip.boxes.has(view.lines[line].a) && strip.boxes.has(view.lines[line].b);
    if (!keep) el.addClass('dim');
  });
};

let lastHash = '';
const render = (animate) => {
  settle();
  applyTheme();
  const view = current();
  const shownAgain = drawAlt();
  cy.batch(() => {
    cy.elements().remove();
    cy.style(styleSheet());
    if (view !== undefined && !altOn()) cy.add(elementsOf(view));
  });
  if (shownAgain) cy.resize();
  if ((animate && !altOn()) || shownAgain) {
    const target = fitView();
    cy.zoom({ level: target.zoom * 0.82, renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 } });
    cy.animate({ zoom: target.zoom, pan: target.pan }, { duration: 200 });
  }
  drawCrumbs();
  drawPickers();
  syncFeatures();
  if (view === undefined) { detail('No overview', ['The model has no placed overview.']); return; }
  drawLegend(view);
  legendChanges();
  $('legend').hidden = altOn();
  drawChips();
  drawOpens();
  drawDetail(view);
  drawRemoved();
  trace(view);
  dimOutsideStrip(view);
  applyFocus(view);
  zoomUpdate(true);
};
commit = (animate) => {
  render(animate);
  lastHash = encode();
  window.location.hash = lastHash;
};

cy.on('zoom pan', () => zoomUpdate(false));
/* The reader's own zoom or pan ends the fit animation of a new view; it would reset them to the fit when it ends. */
['wheel', 'pointerdown'].forEach((name) => $('cy').addEventListener(name, () => cy.stop(), { capture: true, passive: true }));
cy.on('tap', 'node, edge', (event) => {
  const role = event.target.data('role');
  if (role === 'line' || role === 'text' || (role === 'badge' && event.target.data('line') !== undefined)) state.sel = 'l' + event.target.data('line');
  else if (event.target.data('box') !== undefined) state.sel = 'b' + event.target.data('box');
  else return;
  commit(false);
});
cy.on('dbltap', 'node', (event) => {
  const index = event.target.data('box');
  const refit = index === undefined ? null : enter(current().boxes[index]);
  if (refit !== null) commit(refit);
});

$('split').addEventListener('change', () => { state.split = $('split').value; commit(false); });
$('mode').addEventListener('change', () => { state.mode = $('mode').value; state.open = null; state.sel = null; commit(true); });
$('theme').addEventListener('change', () => {
  state.theme = $('theme').value;
  try { localStorage.setItem('overview-theme', state.theme); } catch (error) { /* a preference only */ }
  render(false);
});
const pngUrl = () => cy.png({ full: false, scale: 2,
  bg: getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() });
window.overviewPng = pngUrl;
$('png').addEventListener('click', () => {
  const link = el('a', '', { href: pngUrl(), download: 'overview.png' });
  document.body.append(link);
  link.click();
  link.remove();
});
$('up').addEventListener('click', () => {
  const up = parentLevel();
  if (up !== null) { go(up[1], up[2]); commit(true); }
});
$('search').addEventListener('input', drawHits);
$('search').addEventListener('keydown', (event) => {
  const first = hitsFor($('search').value)[0];
  if (event.key === 'Enter' && first !== undefined) { locate(first); $('search').value = ''; drawHits(); }
  if (event.key === 'Escape') { $('search').value = ''; drawHits(); }
});
document.addEventListener('keydown', (event) => {
  if (event.target.tagName === 'INPUT' || event.target.tagName === 'SELECT') return;
  if (event.key === 'Escape') { state.sel = null; commit(false); }
  if (event.key === 'Enter' && state.sel !== null && state.sel[0] === 'b') {
    const refit = enter(current().boxes[Number(state.sel.slice(1))]);
    if (refit !== null) commit(refit);
  }
});
window.addEventListener('hashchange', () => {
  const text = window.location.hash.slice(1);
  if (text === lastHash) return;
  lastHash = text;
  decode(text);
  render(true);
});

$('theme').value = state.theme;
drawTree();
const start = window.location.hash.slice(1);
if (start !== '') { decode(start); lastHash = start; } else { go(null, null); }
render(false);
fitView();
lastHash = encode();
})();
</script>
</body>
</html>
