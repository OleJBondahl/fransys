schema = 1
name = "Break contact with positive opening operation"
kind = "symbol"
status = "unverified"
reference = { standard = "IEC 60617", number = "break-contact-positive-opening" }
pole_pitch = 8

# The contact of an emergency stop drawn apart from its actuator (D50): the mark sits where
# emergency-stop draws it, right of the break contact on the link's height.
parts = [
  { as = "contact", use = "break-contact" },
  { as = "mark",    use = "positive-opening", at = [2.25, 0] },
]

ports = { in = "contact.in", out = "contact.out" }

[slots]
tag           = "contact.tag"
"marking.in"  = "contact.marking.in"
"marking.out" = "contact.marking.out"
