[project]
name = "fransys-el"
version = "0.19.8"
description = "Fransys electrical conventions: the values a general layout core takes as options."
requires-python = ">=3.15"
dependencies = [
    "fransys-model @ git+https://github.com/OleJBondahl/fransys@v0.19.8#subdirectory=packages/fransys-model",
    "fransys-layout @ git+https://github.com/OleJBondahl/fransys@v0.19.8#subdirectory=packages/fransys-layout",
    "electrical-symbols @ git+https://github.com/OleJBondahl/fransys@v0.19.8#subdirectory=packages/electrical-symbols",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fransys_el"]
