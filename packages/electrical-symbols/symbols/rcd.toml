schema = 1
name = "Residual current operated circuit breaker"
kind = "symbol"
status = "unverified"
reference = { standard = "IEC 60617", number = "rcd" }

parts = [
  { as = "contact",  use = "make-contact" },
  { as = "function", use = "circuit-breaker-function", at = [0, -1] },
  { as = "core",     use = "residual-current-core", at = [0, 1.5] },
]

ports = { in = "contact.in", out = "contact.out" }

anchors = [
  { id = "link", at = [-0.5, 0], dir = "W" },
]

[slots]
tag           = { at = [-1.5, 0], side = "W", box = [6, 1] }
"marking.in"  = { at = [0.25, -2.25], side = "E", box = [1.5, 1] }
"marking.out" = { at = [0.75, 2.25], side = "E", box = [1.5, 1] }
