schema = 1
name = "Contact head (contact table)"
kind = "element"
status = "unverified"
# our own head of a contact table, authored in the row's frame: it sits before the first
# row on the table's axis (y), its lower edge on the row's upper edge (y = 0). A pad, the NO and
# NC title line (one module), a pad, then the rule; its titles sit over the row's cells and grow
# at the same cuts.
reference = { standard = "IEC 60617", number = "contact-head" }

elements = [
  { polyline = [[0, -1.5], [1.25, -1.5], [1.25, 0], [0, 0]], closed = true },
  { line = [[0, -0.25], [1.25, -0.25]] },
]

stretch = [{ axis = "x", at = 0.375 }, { axis = "x", at = 0.875 }]

[slots]
no = { at = [0.25, -0.75], side = "E", box = [0.25, 0.125] }
nc = { at = [0.75, -0.75], side = "E", box = [0.25, 0.125] }
