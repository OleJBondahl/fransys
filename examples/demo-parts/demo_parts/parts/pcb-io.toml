schema = 1

# category = "board" with a [pcb] facet, closed (decision model-0040, author-0002's known
# deviation): the board black-box layout draws a CONNECTOR on or under a board
# (schematic_functions' one exception), and layout-0044 skips a connection or net group
# wholly on or under one board silently instead of failing the drawn-function checks
# (fransys_layout.engines.schematic.replicate/stages.links used to raise LayoutError for
# io_board's own internal wiring, whether authored as wire() conductors or u.net(...), before
# this package landed). This part carries the board's components as a real, numbered
# assembly (class letter "A"), not a part-less container; the board-document view that would
# draw them is a later step, explicitly out of scope.
[part]
mpn = "DEMO-PCB-IO"
manufacturer = "Demo"
description = "I/O board assembly (the worked example of model-0038 units, io_board)"
category = "board"
class_code = "U"

[pcb]
revision = "A"
