[project]
name = "fransys-reports"
version = "0.11.1"
description = "Fransys output: derive rows formatted as CSV."
requires-python = ">=3.15"
dependencies = ["fransys-model @ git+https://github.com/OleJBondahl/fransys@v0.11.1#subdirectory=packages/fransys-model"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fransys_reports"]
