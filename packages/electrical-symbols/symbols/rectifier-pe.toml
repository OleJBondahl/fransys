  { id = "v",     at = [1, -3],  dir = "N", description = "a.c. input, second conductor" },
  { id = "pe",    at = [3, -3],  dir = "N", description = "protective earth" },
  { id = "plus",  at = [-1, 3],  dir = "S", description = "d.c. output, positive" },
  { id = "minus", at = [1, 3],   dir = "S", description = "d.c. output, negative" },
