[look]
ref_tints = ["#ffc0aa", "#85e7cd", "#e4c0ff", "#efcc83", "#80e1fe", "#ffbad4", "#bbdf99", "#bbd1ff"]

[pdf]
list_share_pct = 40  # a list page's column, percent of the content width (pdf-0026, L1)
list_gutter_pct = 20  # the gap between its two columns, same unit
