standard = "IEC 60617"
title = "Electrical graphical symbols"
number_pattern = '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
package = "electrical_symbols"

[vocabulary]
path_kinds = ["conductor", "switch_open", "switch_closed", "impedance", "source", "diode"]
potentials = ["earth", "protective_earth", "functional_earth", "frame"]
links = ["mechanical_link"]

[rules]
required_slots = ["tag", "marking.<port>"]

# wire styles (SYMDEF-SLOTS SS8): layout names a style id and its points, never a weight or a dash
[[wire]]
id = "wire"
weight = "normal"
style = "solid"

[[wire]]
id = "trunk"
weight = "thick"
style = "solid"

[[wire]]
id = "marker"
weight = "normal"
style = "solid"

# the cable blocks and block diagrams (CABLE-DRAWING): a core wire and a diagram line
[[wire]]
id = "core"
weight = "normal"
style = "solid"

[[wire]]
id = "diagram_line"
weight = "normal"
style = "solid"

[[wire]]
id = "link"
weight = "normal"
style = "dashed"

[[wire]]
id = "by_others"
weight = "normal"
style = "dashed"

# The font is measured from the two TTFs in `files` by `symdef build` (SETTINGS-A2); the faces are
# under the Bitstream Vera licence (see fonts/LICENSE). `heights` are library data.

# stroke widths in mm (print_sizes LINE_THIN_MM and LINE_THICK_MM; rule is the table rule) and the
# dash patterns as floats (the settings merge reads a mixed list as a record); symdef writes both
[lines]
normal = 0.25
thick = 0.5
rule = 0.18

[dash]
dashed = [1.25, 0.625]
dash_dot = [4.0, 1.0, 0.25, 1.0]
long = [4.0, 1.0]

[grid]
module_mm = 2.5
divisions_per_module = 8
wire_pitch = 8
wire_pitch_fine = 4

[font]
name = "DejaVu Sans Condensed"
files = { regular = "src/electrical_symbols/fonts/DejaVuSansCondensed.ttf", bold = "src/electrical_symbols/fonts/DejaVuSansCondensed-Bold.ttf" }
text_block = "grid"

[font.heights]
smallest = 1.8
body = 2.5
heading_2 = 3.5
heading_1 = 5.0

