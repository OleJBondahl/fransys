[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "fransys-layout"
version = "0.22.7"
requires-python = ">=3.15"
dependencies = [
    "fransys-model @ git+https://github.com/OleJBondahl/fransys@v0.22.7#subdirectory=packages/fransys-model",
    "symdef==0.31.0",
    "electrical-symbols @ git+https://github.com/OleJBondahl/fransys@v0.22.7#subdirectory=packages/electrical-symbols",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fransys_layout"]
