schema = 1

[part]
mpn = "DEMO-CTRL-20P"
manufacturer = "Demo"
description = "Controller module, 24 V DC supply and twenty one-pin signal connectors with long pin names"
category = "generic"
class_code = "U"

[[function]]
name = "supply"
kind = "load"
ports = [
    { name = "+", role = "generic" },
    { name = "-", role = "generic" },
]

[function.operating]
voltage_dc_v = "24"

[[function]]
name = "s1"
kind = "connector"
ports = [
    { name = "SIGNAL_CHANNEL_01", role = "generic" },
]

[function.connector]
style = "port-1p"
