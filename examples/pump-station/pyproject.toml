[project]
name = "fransys-examples"
version = "0.0.0"
description = "A two-pump station authored with Fransys, on real catalogue parts."
requires-python = ">=3.15"
dependencies = [
    "example-parts==0.1.0",
    "fransys @ git+https://github.com/OleJBondahl/fransys@v0.13.4#subdirectory=packages/fransys",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "ty==0.0.82",
]

[tool.uv]
package = false
# wireviz 0.4.1 declares pyyaml, but the old wireviz harness output used wireviz.Harness only, which never
# imports it. pyyaml 6.0.3 has no Python 3.15 wheel yet: remove this line when it ships one.
# (Same workaround as Fransys' own root pyproject.toml.)
exclude-dependencies = ["pyyaml"]

[tool.uv.sources]
example-parts = { path = "parts", editable = true }

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.format]
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ty.environment]
python-version = "3.15"
