# The docs site config (decision 0105). Zensical (experimental) and Material for MkDocs both read it.
# `scripts/build_site.py` copies it to .fransys/mkdocs.yml (the project root: Zensical keeps site_dir
# inside it) and appends the `nav:` it generates. Pages are staged into .fransys/site-src/.
site_name: Fransys
site_url: https://olejbondahl.github.io/fransys/
repo_url: https://github.com/OleJBondahl/fransys
docs_dir: site-src
site_dir: site
use_directory_urls: true
extra:
  announce: "Beta: the API may change between minor versions until 1.0.0."
extra_css:
  - extra.css

theme:
  name: material
  custom_dir: overrides
  logo: assets/fransys-wordmark-white.svg
  favicon: assets/fransys-icon.svg
  features:
    - navigation.sections
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
