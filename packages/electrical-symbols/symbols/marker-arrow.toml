schema = 1
name = "Marker arrow (reference marker, horizontal text)"
kind = "element"
status = "unverified"
# our own reference marker: an arrow flag, its tip on the origin and pointing east, the reference text
# centred in the whole flag; the flag grows along x with the text (fitted_symbol)
reference = { standard = "IEC 60617", number = "marker-arrow" }

elements = [
  { polyline = [[0, 0], [0.375, -0.75], [2.25, -0.75], [2.25, 0.75], [0.375, 0.75]], closed = true, fill = "tint" },
]

stretch = [{ axis = "x", at = 1.125 }]

lint_allow = [
  { rule = "slot-overlap-body", reason = "the text box is centred in the flag and its width is the text's: it lies inside the outline" },
]

[slots]
ref = { at = [1.125, 0], side = "C", box = [1.75, 1] }
