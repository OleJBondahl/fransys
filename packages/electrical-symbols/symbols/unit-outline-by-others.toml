schema = 1
name = "Unit outline, by others"
kind = "element"
status = "unverified"
# our own frame: the boundary of a part supplied by others, dashed. Stretch on x and y (two calls) sets its size; the label slot stays at the
# top-left corner inside the frame
reference = { standard = "IEC 60617", number = "unit-outline-by-others" }

elements = [
  { polyline = [[0, 0], [7, 0], [7, 2], [0, 2]], closed = true, style = "dashed" },
]

stretch = [{ axis = "x", at = 6.5 }, { axis = "y", at = 1.5 }]

lint_allow = [
  { rule = "slot-overlap-body", reason = "the label text box does not rotate and is wider than the frame is tall once rotated; the frame is drawn unrotated and the text stays inside the outline" },
]

[slots]
label = { at = [0.25, 0.75], side = "E", box = [6, 1] }
