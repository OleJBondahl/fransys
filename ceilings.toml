# The lean gates' ceilings: a landing may raise one with a reason in its commit message
# (decision 0121), and a cleanup round lowers it with the ceil-lower tool. Every comment
# here comes from lean_ceilings.py and lean_check.py.

[limits]
branches = 12
code_lines = 51000  # code-only ceiling (decision 0408)
code_lines_enforce = 0  # 1 once the release flips it; until then it only reports (KI-050)
complexity = 8
docstring_lines = 5  # summary, blank, two why lines, closing quotes (LC3)
