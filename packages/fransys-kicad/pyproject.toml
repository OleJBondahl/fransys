[project]
name = "fransys-kicad"
version = "0.12.0"
description = "Fransys output: KiCad netlist. Dev tool: KiCad symbol to part-file skeleton."
requires-python = ">=3.15"
dependencies = ["fransys-model @ git+https://github.com/OleJBondahl/fransys@v0.12.0#subdirectory=packages/fransys-model"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fransys_kicad"]
