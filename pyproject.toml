[project]
name = "fransys-workspace"
version = "0.0.0"
description = "Workspace root of Fransys. Not a package."
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis==6.168.3",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.9",
    "ty==0.0.84",
    "typst==0.15.0",
    "vulture==2.16",
    "graphical-symbols==0.3.0",
    "electrical-symbols",
    "fransys-model",
    "fransys-layout",
    "fransys",
    "demo-parts",
    "pillow==12.3.0",
    "pypdfium2==5.14.0",
    "rust-just==1.58.0",
]
# experimental (like uv audit, decision 0052): only `just site` installs it, `just ci` never needs it
site = [
    "zensical==0.0.68",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/fransys-model",
    "packages/fransys-layout",
    "packages/electrical-symbols",
    "packages/fransys-parts",
    "packages/fransys-author",
    "packages/fransys-render",
    "packages/fransys-reports",
    "packages/fransys-pdf",
    "packages/fransys-kicad",
    "packages/fransys-wago",
    "packages/fransys-overview",
    "packages/fransys",
    "examples/demo-parts",
]

[tool.uv.sources]
fransys-model = { workspace = true }
fransys-layout = { workspace = true }
graphical-symbols = { git = "https://github.com/OleJBondahl/graphical-symbols", tag = "v0.3.0" }
electrical-symbols = { workspace = true }
fransys = { workspace = true }
fransys-parts = { workspace = true }
fransys-author = { workspace = true }
fransys-render = { workspace = true }
fransys-reports = { workspace = true }
fransys-pdf = { workspace = true }
fransys-kicad = { workspace = true }
fransys-wago = { workspace = true }
fransys-overview = { workspace = true }
demo-parts = { workspace = true }

[tool.ruff]
line-length = 100
# Absorbed packages are first-party for import sorting, as in their own repos; stubs are not.
src = [
    "packages/electrical-symbols/src",
    "packages/fransys-model/src",
    "packages/fransys-layout/src",
]
target-version = "py315"
# Generated by packages/fransys-overview/scripts/vendor_cytoscape.py (decision overview-0001).
extend-exclude = [
    "packages/fransys-overview/src/fransys_overview/_vendor_cytoscape.py",
    "examples/pump-station",
]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["ALL"]
# Only the two named preview rules run; the rest of preview stays off (decision 0088).
preview = true
explicit-preview-rules = true
extend-select = ["PLR1702", "PLC2701"]
ignore = [
    "COM812",  # fights `ruff format`
    "CPY001",  # one root LICENSE, no per-file copyright notice
    "INP001",  # tests and scripts are not packages
    "TRY003",  # long messages in exception calls are the house style
    "D100",  # LC3/MS8: the lean check asserts API-surface docstrings instead
    "D101",  # LC3/MS8: the lean check asserts API-surface docstrings instead
    "D102",  # LC3/MS8: the lean check asserts API-surface docstrings instead
    "D103",  # LC3/MS8: the lean check asserts API-surface docstrings instead
    "D104",  # LC3/MS8: the lean check asserts API-surface docstrings instead
    "D105",  # LC3/MS8: the lean check asserts API-surface docstrings instead
    "D106",  # LC3/MS8: the lean check asserts API-surface docstrings instead
    "D107",  # LC3/MS8: the lean check asserts API-surface docstrings instead
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# The kernel reads every `@record` and `@value` annotation at runtime, so the names in them
# must be real imports: under TYPE_CHECKING an enum or a `Decimal` never resolves and freeze()
# refuses the field (model design/kernel-records.md 5.3, design/kernel-model.md 5.6). This makes ruff enforce it (TC004).
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = [
    "fransys_model.kernel.record",
    "fransys_model.kernel.value",
    "fransys_model.kernel.record.record",
    "fransys_model.kernel.record.value",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN", "D", "PLC0415", "PLR2004", "S101", "SLF001", "PLC2701"]  # tests reach into privates and private modules by design; ANN/D/PLR2004/S101 as before; PLC0415 imports inside tests are allowed
"tests/**" = ["ANN", "D", "PLC0415", "PLR2004", "S101", "SLF001", "PLC2701"]  # same as above, root tests
"conftest.py" = ["SLF001", "PLC2701"]  # root conftest reaches into private modules by design
"packages/*/src/**" = ["C901", "PLR0912", "PLR0915"]  # the lean check (decision 0087) owns function size, with ceilings
"packages/fransys-author/src/**" = ["SLF001"]  # the model's draft builder (`_add`, `_extend`, `_draft`, `_catalogue`) is the author role's by design (invariant 1: an input produces a Draft); public names would put builder methods on `Draft`, which `fransys` re-exports to consumers
"packages/fransys-author/src/fransys_author/surface/_{cable,device,facts,layout,links,series,strip,supplies,units,wire}.py" = ["UP037"]  # self: 'Design' is quoted on purpose: Design imports these mixins, and inspect.signature must not resolve it (decision 0111)
# These two fransys-model tests build a backwards order on purpose: reversed(sorted(...)).
"packages/fransys-model/tests/vocab/examples.py" = ["C413"]
"packages/fransys-model/tests/vocab/test_core_vocabulary.py" = ["C413"]
# CLI scripts report through stdout.
"packages/*/scripts/**" = ["T20"]  # CLI scripts report through stdout
# whitelist.py: vulture's own documented whitelist pattern is a bare attribute access with no
# assignment, one line per name -- exactly what B018 flags (decision 0050).
"whitelist.py" = ["B018"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "internal"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["wp(name): the work package that implements this acceptance test"]

[tool.ty.src]
# The public repo carries the examples export here (PM5); it has its own gate.
exclude = ["examples/pump-station"]

[tool.ty.environment]
python-version = "3.15"
# The fransys-model tests import their helper modules by name (see its tests/conftest.py); these
# paths let ty resolve them (derive_helpers, plant, examples, ...). The root re-authoring test
# imports the layout package's hand-built cabinet the same way, through a sys.path insert that ty
# cannot see statically.
extra-paths = [
    "packages/fransys-model/tests/derive",
    "packages/fransys-model/tests/vocab",
    "packages/fransys-layout/tests",
]

[tool.ty.rules]
# Every rule is an error (decision 0089, LC5); the walk-backs are the two overrides below.
all = "error"
# Every suppression is precise, used and valid (docs/specs/2026-09-27-lean-codebase.md, LC6).
blanket-ignore-comment = "error"
unused-ignore-comment = "error"
ignore-comment-unknown-rule = "error"
invalid-ignore-comment = "error"

# fixtures build loose and runtime shapes on purpose
[[tool.ty.overrides]]
include = ["tests/**", "scripts/**", "internal/**", "packages/*/tests/**", "packages/*/scripts/**"]
[tool.ty.overrides.rules]
missing-type-argument = "ignore"
unsound-return-statement = "ignore"
unsound-assignment = "ignore"
unsupported-dynamic-base = "ignore"
unsound-yield = "ignore"

[tool.vulture]
# Enum members that only downstream packages and the tests use (the guide's vocabulary), so
# vulture, which scans src alone, sees no use. Names match globally: add one only when it is a
# member of the public data model.
ignore_names = [
    "THICK", "VERIFIED", "UNVERIFIED", "ELEMENT", "QUALIFIER",
    "SWITCH_OPEN", "SWITCH_CLOSED", "IMPEDANCE", "SOURCE", "DIODE", "CONDUCTOR",
    "EARTH", "PROTECTIVE_EARTH", "FUNCTIONAL_EARTH", "FRAME",
    "R0", "R90", "R180", "R270", "MR0", "MR90", "MR180", "MR270",
    "OWNER", "USER", "ITEM", "PIN", "W", "POWER", "CONTROL", "SIGNAL",
    "ELECTROMECHANICAL", "BOARD", "GENERIC", "SWITCH", "PLC_CHANNEL", "LOAD",
    "SENSOR", "ACTUATOR", "BUSBAR", "PRODUCT", "DI", "DO", "AI_CURRENT",
    "AI_VOLTAGE", "AO_CURRENT", "AO_VOLTAGE", "RTD", "RELAY", "MALE", "FEMALE",
    "NEUTRAL", "CABINET_SCHEMATIC", "HARNESS_DRAWING", "PCB_SCHEMATIC", "COVER",
    "NOTES", "CONTENTS", "SCHEMATIC", "PLC_LIST", "TERMINAL_LIST",
    "CONNECTOR_LIST", "WIRE_LABEL_LIST", "DESIGNATION_LIST", "CABLE_LIST", "BOM",
    "FREE", "CONTACT_IMAGE", "TERMINAL_ECHO", "CROSS_UNIT",
]
ignore_decorators = ["@fact"]
