schema = 2

[part]
mpn = "DEMO-MOTOR-11KW-YD"
manufacturer = "Demo"
description = "Three-phase motor, 11 kW, six winding terminals for star-delta starting"
category = "generic"
class_code = "M"

[[function]]
name = "start"
kind = "actuator"
ports = [
    { name = "U1", role = "generic", conductor = "L1" },
    { name = "V1", role = "generic", conductor = "L2" },
    { name = "W1", role = "generic", conductor = "L3" },
    { name = "PE", role = "pe" },
]

[function.operating]
voltage = [{ nom = "400 V", at = ["AC"] }]
nominal_power = "11000 W"
nominal_current = "21 A"

[[function]]
name = "end"
kind = "generic"
ports = [
    { name = "W2", role = "generic", conductor = "L1" },
    { name = "U2", role = "generic", conductor = "L2" },
    { name = "V2", role = "generic", conductor = "L3" },
]
