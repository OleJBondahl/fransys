[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "fransys-model"
version = "0.23.11"
requires-python = ">=3.15"
dependencies = [
    "refdef==0.3.1",
    "elecdef==0.7.0",
    "fransys-kernel @ git+https://github.com/OleJBondahl/fransys@v0.23.11#subdirectory=packages/fransys-kernel",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fransys_model"]
