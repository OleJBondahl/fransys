revision_date = { at = [81.875, 6.375], side = "C", box = [6.75, 2.5] }
"label.customer" = { at = [7.5, 13.25], side = "C", box = [13, 1.75] }
customer = { at = [7.5, 16.375], side = "C", box = [13, 2.5] }
"label.author" = { at = [22.5, 13.25], side = "C", box = [13, 1.75] }
