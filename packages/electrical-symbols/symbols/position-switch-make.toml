schema = 1
name = "Position switch, make contact"
kind = "symbol"
status = "unverified"
reference = { standard = "IEC 60617", number = "position-switch-make" }
pole_pitch = 8

parts = [
  { as = "contact",  use = "make-contact" },
  { as = "actuator", use = "actuator-position", attach = "link", to = "contact.link", length = 2, via = "mechanical_link" },
]

ports = { in = "contact.in", out = "contact.out" }

[slots]
tag           = { at = [-4, 0], side = "W", box = [6, 1] }
"marking.in"  = "contact.marking.in"
"marking.out" = "contact.marking.out"
