schema = 2

[part]
mpn = "DEMO-PLC-CPU"
manufacturer = "Demo"
description = "PLC controller, 24 V DC supply, I/O modules on its backplane"
category = "plc_module"
class_code = "K"

[[function]]
name = "power"
kind = "load"
ports = [
    { name = "24V", role = "generic", side = "line", conductor = "L+" },
    { name = "0V", role = "generic", side = "load", conductor = "L-" },
]

[function.operating]
voltage = [{ nom = "24 V", at = ["DC"] }]
nominal_current = "0.5 A"
