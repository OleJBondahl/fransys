<svg xmlns="http://www.w3.org/2000/svg" width="10mm" height="8.5mm" viewBox="-1 -1.4 4 3.4">
<title>Bridge mark tick</title>
<g fill="none" stroke="#000" stroke-linecap="butt" stroke-linejoin="miter">
<line x1="0" y1="0.5" x2="2" y2="0.5" stroke-width="0.1"/>
</g>
<g class="annotation">
<circle class="grid" cx="-1" cy="-1" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="0" cy="-1" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="1" cy="-1" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="2" cy="-1" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="3" cy="-1" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="-1" cy="0" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="0" cy="0" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="1" cy="0" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="2" cy="0" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="3" cy="0" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="-1" cy="1" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="0" cy="1" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="1" cy="1" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="2" cy="1" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="3" cy="1" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="-1" cy="2" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="0" cy="2" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="1" cy="2" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="2" cy="2" r="0.06" fill="#888" stroke="none"/>
<circle class="grid" cx="3" cy="2" r="0.06" fill="#888" stroke="none"/>
<rect class="body-box" x="0" y="0.5" width="2" height="0" fill="none" stroke="#0a0" stroke-width="0.05" stroke-dasharray="0.2 0.2"/>
<rect class="keepout-box" x="0" y="0" width="2" height="1" fill="none" stroke="#a0a" stroke-width="0.05" stroke-dasharray="0.2 0.2" stroke-dashoffset="0.2"/>
<rect class="slot-box" x="0" y="0" width="2" height="0.5" fill="#06c" fill-opacity="0.12" stroke="#06c" stroke-width="0.03"/>
<text class="slot-id" x="0" y="-0.1" font-size="0.3" text-anchor="start" fill="#06c" stroke="none" font-family="sans-serif">above</text>
<rect class="slot-box" x="0" y="0.5" width="2" height="0.5" fill="#06c" fill-opacity="0.12" stroke="#06c" stroke-width="0.03"/>
<text class="slot-id" x="0" y="0.4" font-size="0.3" text-anchor="start" fill="#06c" stroke="none" font-family="sans-serif">below</text>
</g>
</svg>
