title = { at = [27.5, 6.375], side = "C", box = [53, 2.5] }
"label.number" = { at = [61.875, 3.25], side = "C", box = [11.75, 1.75] }
number = { at = [61.875, 6.375], side = "C", box = [11.75, 2.5] }
