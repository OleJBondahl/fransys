schema = 1
name = "Marker arrow (reference marker, text along the wire)"
kind = "element"
status = "unverified"
# our own reference marker for a vertical wire: an arrow flag, its tip on the origin and pointing
# south, the reference text turned to read bottom-up along it; orient to N for a north-pointing flag
reference = { standard = "IEC 60617", number = "marker-arrow-turned" }

elements = [
  { polyline = [[0, 0], [-0.75, 0.375], [-0.75, 2.25], [0.75, 2.25], [0.75, 0.375]], closed = true, fill = "tint" },
]

stretch = [{ axis = "y", at = 1.125 }]

lint_allow = [
  { rule = "slot-overlap-body", reason = "the text box is centred in the flag and its length is the text's: it lies inside the outline" },
]

[slots]
ref = { at = [0, 1.125], side = "C", box = [1, 1.75], turn = true }
