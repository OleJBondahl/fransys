schema = 1
name = "Transformer with two windings, boxed"
kind = "symbol"
status = "unverified"
# our own symbol: the psu box with the two-winding sign inside; a part chooses it with `symbol = "transformer-box"`
reference = { standard = "IEC 60617", number = "transformer-box" }

# primary on top, secondary below, so a supply column reads top to bottom
ports = [
  { id = "p1", at = [-1, -3], dir = "N", description = "primary winding, first end" },
  { id = "p2", at = [1, -3],  dir = "N", description = "primary winding, second end" },
  { id = "s1", at = [-1, 3],  dir = "S", description = "secondary winding, first end" },
  { id = "s2", at = [1, 3],   dir = "S", description = "secondary winding, second end" },
]

paths = [
  { from = "p1", to = "p2", kind = "impedance" },
  { from = "s1", to = "s2", kind = "impedance" },
]

elements = [
  { line = [[-1, -3], [-1, -2]] },
  { line = [[1, -3], [1, -2]] },
  { line = [[-1, 3], [-1, 2]] },
  { line = [[1, 3], [1, 2]] },
  { polyline = [[-3, -2], [3, -2], [3, 2], [-3, 2]], closed = true },
  { circle = [-0.5, 0], r = 1, fill = "none" },
  { circle = [0.5, 0],  r = 1, fill = "none" },
]

lint_allow = [
  { rule = "through-missing", reason = "an isolating transformer: no conductive path joins the primary to the secondary, so no path can be the through path" },
]

[slots]
tag            = { at = [-3.5, 0],      side = "W", box = [6, 1] }
"marking.p1"   = { at = [-0.75, -2.75], side = "E", box = [1.5, 1] }
"marking.p2"   = { at = [1.25, -2.75],  side = "E", box = [1.5, 1] }
"marking.s1"   = { at = [-0.75, 2.75],  side = "E", box = [1.5, 1] }
"marking.s2"   = { at = [1.25, 2.75],   side = "E", box = [1.5, 1] }
