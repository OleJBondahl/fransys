schema = 1
name = "Power supply, rail symbol"
kind = "symbol"
status = "unverified"
reference = { standard = "IEC 60617", number = "power-supply" }

ports = [
  { id = "supply", at = [0, 1], dir = "S" },
]

nodes = [
  { ports = ["supply"] },
]

elements = [
  { line = [[-1, -1], [1, -1]] },
  { line = [[0, -1], [0, 1]] },
]

lint_allow = [
  { rule = "slot-missing", reason = "no tag is drawn on a power symbol; the library requires a tag slot of every symbol until TEXT-IN-LOOP T1 drops it (SUPPLY-SLOT R1605)" },
  { rule = "port-isolated", reason = "supply rail marker; none of the toolkit's node potentials (earth, protective_earth, functional_earth, frame) names a plain rail reference (see the decisions file)" },
]

[slots]
"marking.supply" = { at = [0, -1.5], side = "N", box = [2, 1] }
