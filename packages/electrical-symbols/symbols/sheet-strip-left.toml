schema = 1
name = "Sheet strip cell (left)"
kind = "element"
status = "unverified"
# our own reference strip cell: one row of the frame's left strip, in mm. Stretched to the grid
# pitch and the strip depth, then `table(cell, n, "y")`. The thick edge is the frame border's
# segment this cell stands on; the tick closes the cell and is drawn only between cells.
reference = { standard = "IEC 60617", number = "sheet-strip-left" }

elements = [
  { line = [[1, 0], [1, 1]], weight = "thick" },
  { line = [[0, 1], [1, 1]], between = true },
]

stretch = [{ axis = "x", at = 0.5 }, { axis = "y", at = 0.5 }]

[slots]
label = { at = [0.5, 0.5], side = "C", box = [1, 0.5] }
