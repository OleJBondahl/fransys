schema = 2

[part]
mpn = "DEMO-PSU-24-PE"
manufacturer = "Demo"
description = "Power supply, 24 V DC out, AC in, protection class I"
category = "generic"
class_code = "T"

[rating]
power_loss = { nom = "12 W" }

[[function]]
name = "input"
kind = "load"
ports = [
    { name = "L", role = "generic", side = "line" },
    { name = "N", role = "generic", side = "load" },
    { name = "PE", role = "pe" },
]

[function.rating]
voltage = [{ nom = "264 V", at = ["AC"] }]

[[function]]
name = "output"
kind = "supply"
ports = [
    { name = "+", role = "generic" },
    { name = "-", role = "generic" },
]

[function.operating]
voltage = [{ nom = "24 V" }]
