schema = 2

[part]
mpn = "CHAIN-MODULE-48V-BUS"
manufacturer = "Demo"
description = "DIN-rail 48 V DC bus I/O module (24/48 V class, 2 A rated supply current) with a 4-in 4-out bus coupler"
category = "generic"
class_code = "G"

[[function]]
name = "pw"
kind = "supply"
ports = [
    { name = "P+", role = "generic", side = "load" },
    { name = "P-", role = "generic", side = "line" },
]

[function.operating]
voltage = [{ nom = "48 V" }]
nominal_current = "2 A"

[[function]]
name = "bus"
kind = "generic"
ports = [
    { name = "BUS IN 1", role = "generic", side = "line" },
    { name = "BUS IN 2", role = "generic", side = "line" },
    { name = "BUS IN 3", role = "generic", side = "line" },
    { name = "BUS IN 4", role = "generic", side = "line" },
    { name = "OUT 1", role = "generic", side = "load" },
    { name = "OUT 2", role = "generic", side = "load" },
    { name = "OUT 3", role = "generic", side = "load" },
    { name = "OUT 4", role = "generic", side = "load" },
]
