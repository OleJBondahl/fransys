[paper]
default = "A3"

[paper.formats.A3]
name = "A3 landscape"
width_mm = 420
height_mm = 297
content_x_mm = 5
content_y_mm = 5
content_width_mm = 410
content_height_mm = 267
frame_columns = 8
frame_rows = 6

[paper.formats.A2]
name = "A2 landscape"
width_mm = 594
height_mm = 420
content_x_mm = 5
content_y_mm = 5
content_width_mm = 584
content_height_mm = 390
frame_columns = 12
frame_rows = 8

[look]
ref_tints = ["#ffc0aa", "#85e7cd", "#e4c0ff", "#efcc83", "#80e1fe", "#ffbad4", "#bbdf99", "#bbd1ff"]

[pdf]
list_share_pct = 40  # a list page's column, percent of the content width (pdf-0026, L1)
list_gutter_pct = 20  # the gap between its two columns, same unit
page_margin_mm = 5  # the padding of a non-drawing page inside the content box
cable_run_header_mm = 11  # a cable run page's extra top margin: the part line and a 4 mm gap below it (pdf-0021)
bridge_column_mm = 15  # the terminal list's Bridge column width

# Stroke widths in mm and dash patterns in mm: library data a consumer may replace key by key. Every
# dash number is a float, so the merge reads a list of numbers (symdef prints them, SYMDEF-DATA).
[lines]
normal = 0.25
thick = 0.5
rule = 0.18

[dash]
dashed = [1.25, 0.625]
dash_dot = [4.0, 1.0, 0.25, 1.0]
long = [4.0, 1.0]

[reference]
page_prefix = "p"  # opens a page in a reference, "p3"
cell_sep = ":"  # between the page and the cell, "p3:A1"
width_sample = "/99.99"  # a width stand-in for the contact-table and cross-reference column

[frame]
row_labels = "letters"  # the frame rows A, B, C
column_labels = "numbers"  # the frame columns 1, 2, 3
row_order = "top_down"  # rows counted from the top

[stub]
arrow_in = "←"  # a stub that points up
arrow_out = "→"  # a stub that points elsewhere
port_sep = ":"  # between the far end and its ports
port_join = " "  # between port tails

[wire_label]
separator = " "  # between the two ends of a wire label
show_ends = true  # print both ends

[harness]
branch_sep = "."  # a branch of a harness line, "-W13.n"

[title_block]
fields = ["title", "number", "revision", "revision_date", "customer", "author", "page_title", "scope", "page"]
band_mm = 20.0  # the band's height
centre_gap_mm = 3.125  # label centre to value centre
label_height_mm = 1.8  # the capital heights the stack above is authored for; the band grows when the build's heights exceed them
value_height_mm = 2.5

[revision_table]
columns = ["revision", "date", "description", "created", "checked", "approved"]  # keys of [words]
description_mm = 120.0  # the one wrapping column

[revision]
date_format = "YYYY-MM-DD"
initials_required = true
format = "{version}.{revision}"

[designation]
number_start = 1  # the first number an automatic designation takes, -K1

[export]
reports = ["bom", "plc", "wires", "designations", "cables", "cores"]  # the whole-model reports written, in this order
name_join = "-"  # between the prefix, the kind and the fragment of a file name
version_sign = "-v"  # between a set name and its version, "pump-v1.0"
ref_sign = "-"  # replaces each sign of a designation in a file name
data_dir = "data"  # the folder of the CSV and XML files in the output folder
data_suffixes = [".csv", ".xml"]  # the files that go to data_dir
csv_delimiter = ","  # between the cells of a CSV line
csv_encoding = "utf-8"  # a CSV file's encoding; "utf-8-sig" opens in Excel with its accents
csv_quoting = "minimal"  # minimal, all, nonnumeric or none
csv_newline = "\n"  # ends a CSV line
hide_pe = false  # true leaves the PE rail's wires and the PE symbols on device pins off every drawing sheet; the lists keep them

# The columns each list prints, in order: the row `field`, and the `[words]` keys of its PDF
# heading (`pdf`) and its CSV header (`csv`). `pdf_columns` is the subset the PDF prints.
[lists.terminal]
pdf_columns = ["designation", "group", "index", "internal_ends", "external_ends"]

[[lists.terminal.columns]]
field = "designation"
pdf = "designation"
csv = "csv_designation"

[[lists.terminal.columns]]
field = "group"
pdf = "head_group"
csv = "csv_group"

[[lists.terminal.columns]]
