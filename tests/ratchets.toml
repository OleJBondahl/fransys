# DRAWN-NETLIST (el-0052, R388, R412) with DRAWING-INVARIANTS (el-0048, R360): what the finished-drawing
# sweep finds on the six corpus cases (internal/tests/test_corpus_drawing_invariants.py). OVERLAP and
# OUT_OF_PAGE count members; the other codes count findings. A stock only falls; a code is an ERROR
# in the commit that brings its stock to 0. OVERLAP is DI's members plus el-0052's wire-through-body
# class (R387, R388), measured on the merge of DI dfe952a66: page overlaps 22, 26, 31, 6 plus
# wires through bodies 157, 12, 102, 15. On the merge of frames b9b12623e (MARKER-KEEPS-WIRE R453
# counts overlap, SHORTS-ROUTE R454, COPY-JOIN R457): page overlaps 23, 26, 31, 6 plus 157, 13, 102,
# 15. DRAWING_SHORTS_NETS is 0 on every build since ROUTING (R439) and SHORTS-ROUTE, so it is an ERROR.
# R500 (Covered by: PIN-HANGINGS, which fits each tag marker as a footprint keep by link_fit, H3): a tag record holds the wide box (TEXT-CANDIDATES), so 3 tags touch a neighbour the plain box cleared: machine_panel 0 to 1, mcc 0 to 1, panel_di16p 8 to 10; placement still reserves the plain box (TAG-FIT lane)
# XF-UNIT-SCOPE (R497 U3, R510): a trunk now clears the pins of the card row it hangs from, which
# moves it past unrelated sensors: machine_panel 1 -> 3, panel_di16p 10 -> 12 (marker-arrow-turned
# pairs). Covered by: PIN-HANGINGS - layout anchors (R516).
