# The stocks of the ast-grep rules in rules/ (spec CONSOLIDATE C2; decision root-0356). One table per
# rule file id: `stock` = sites found by `ast-grep scan`; `mark` = "forbid" (any site fails) or
# "count" (above or below the stock fails); `home` = where the concept lives; `forbid_after` = when
# a count reaches 0. A stock only falls: a raised stock or a new table above 0 needs a `Root-line:`
# in the commit message (internal/scripts/count_rise.py).

[r13-dead-tree-skip]
stock = 0
mark = "forbid"
home = "scripts/ci_gates.py source_files"
forbid_after = "now (L14 part 1)"

