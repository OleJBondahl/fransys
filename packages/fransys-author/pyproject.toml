[project]
name = "fransys-author"
version = "0.13.5"
description = "Fransys input: the Python authoring API."
requires-python = ">=3.15"
dependencies = ["fransys-model @ git+https://github.com/OleJBondahl/fransys@v0.13.5#subdirectory=packages/fransys-model"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fransys_author"]
