[project]
name = "fransys"
version = "0.19.9"
description = "Electrical drawings, lists and documents from Python. Docs: https://olejbondahl.github.io/fransys/latest/; for the installed version use /<fransys.__version__>/ and its llms.txt. Do not read site-packages."
requires-python = ">=3.15"
dependencies = [
    "fransys-model @ git+https://github.com/OleJBondahl/fransys@v0.19.9#subdirectory=packages/fransys-model",
    "fransys-parts @ git+https://github.com/OleJBondahl/fransys@v0.19.9#subdirectory=packages/fransys-parts",
    "fransys-author @ git+https://github.com/OleJBondahl/fransys@v0.19.9#subdirectory=packages/fransys-author",
    "fransys-el @ git+https://github.com/OleJBondahl/fransys@v0.19.9#subdirectory=packages/fransys-el",
    "fransys-layout @ git+https://github.com/OleJBondahl/fransys@v0.19.9#subdirectory=packages/fransys-layout",
    "fransys-render @ git+https://github.com/OleJBondahl/fransys@v0.19.9#subdirectory=packages/fransys-render",
    "fransys-reports @ git+https://github.com/OleJBondahl/fransys@v0.19.9#subdirectory=packages/fransys-reports",
    "fransys-pdf @ git+https://github.com/OleJBondahl/fransys@v0.19.9#subdirectory=packages/fransys-pdf",
    "fransys-kicad @ git+https://github.com/OleJBondahl/fransys@v0.19.9#subdirectory=packages/fransys-kicad",
    "fransys-wago @ git+https://github.com/OleJBondahl/fransys@v0.19.9#subdirectory=packages/fransys-wago",
    "fransys-overview @ git+https://github.com/OleJBondahl/fransys@v0.19.9#subdirectory=packages/fransys-overview",
    "typst==0.15.0",
]

[project.urls]
Documentation = "https://olejbondahl.github.io/fransys/"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fransys"]
