[project]
name = "fransys-parts"
version = "0.13.2"
description = "Fransys input: part-file loader and linter."
requires-python = ">=3.15"
dependencies = ["fransys-model @ git+https://github.com/OleJBondahl/fransys@v0.13.2#subdirectory=packages/fransys-model"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fransys_parts"]
