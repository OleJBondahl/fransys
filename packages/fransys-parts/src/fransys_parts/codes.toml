[[code]]
code = "BOARD_WITHOUT_PCB"
severity = "WARNING"
stage = "library load"
who = "part author"
cause = "A part with `category = \"board\"` has no `[pcb]` table."
fix = "A board has a `[pcb]` table with a string `revision`, or a `category` other than board. Write: revision = \"A\""
page = "findings-parts"

[[code]]
code = "CABLE_PAIR_INVALID"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A `[cable_product]` `pairs` entry breaks a pair rule: a core is out of range, in two pairs, or `SH`, or a `screen` is not a unique `SH` core."
fix = "Each `pairs` entry has two integer `cores` in range, neither `SH` nor in another pair, and a `screen` that is one unique `SH` core. Write: pairs = [{{ cores = [1, 2], screen = 3 }}]"
page = "findings-parts"

[[code]]
code = "CABLE_WITHOUT_PRODUCT"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A part with `category = \"cable\"` has no `[cable_product]` table, or a part with another category has one."
fix = "A `category = \"cable\"` part has a `[cable_product]` table, and no other part does. Write: [cable_product]"
page = "findings-parts"

[[code]]
code = "CLASS_CODE"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "`class_code` is not 1 to 3 uppercase letters, starts with A, I or O, or starts with D, L, V, Y or Z."
fix = "Use 1 to 3 uppercase letters, the first as in IEC 81346-2, such as `K` or `QA`. Write: class_code = \"K\""
page = "findings-parts"

[[code]]
code = "ENUM_VALUE"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A field typed as an enum holds a string that is no member of that enum."
fix = "The field takes one of the values the message lists, spelled as the contract gives them. Write: kind = \"load\""
page = "findings-parts"

[[code]]
code = "FACET_KIND_MISMATCH"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A `[function.connector]` sits on a function whose `kind` is not `connector`, or a `[function.plc_channel]` on one whose `kind` is not `plc_channel`."
fix = "A `[function.connector]` needs `kind = \"connector\"`, and a `[function.plc_channel]` needs `kind = \"plc_channel\"`. Write: kind = \"connector\""
page = "findings-parts"

[[code]]
code = "FIELD_MISSING"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A required key is absent: the file's `schema`, its `[part]` table, or a required field of a table."
fix = "Each file needs `schema`, its `[part]` table and each required field, with values the contract allows. Write: schema = 2"
page = "findings-parts"

[[code]]
code = "FIELD_TYPE"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A value has a TOML type the contract does not allow there, such as an integer for a quantity or a table where a list belongs."
fix = "Write the value as the type the message names, a quoted string for a rating or an integer for `schema`. Write: schema = 2"
page = "findings-parts"

[[code]]
code = "FIELD_UNKNOWN"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A table holds a key the part-file contract does not name for that table."
fix = "A table takes only the keys the part-file contract names for it. Write: <contract key> = <same value>"
page = "findings-parts"

[[code]]
code = "FILE_NAME"
severity = "WARNING"
stage = "library load"
who = "part author"
cause = "A part file's name has characters other than lowercase letters, digits, hyphens and underscores."
fix = "A part file name uses only lowercase letters, digits, hyphens and underscores. Write: relay-2co-24vdc.toml"
page = "findings-parts"

[[code]]
code = "FILE_UNREADABLE"
severity = "ERROR"
stage = "library load"
who = "consumer"
cause = "A part-file could not be read (missing file, permission error, or bad encoding)."
fix = "No call clears this: fix the path, the file permissions or the UTF-8 encoding, then load again."
page = "findings-build"

[[code]]
code = "FLOAT_FORBIDDEN"
severity = "ERROR"
stage = "library load"
who = "consumer"
cause = "A part-file has a bare TOML float, which the contract forbids (quote values as strings)."
fix = "A number is a quoted string in a part file, never a bare TOML float. Write: nominal_current = \"24.5 A\""
page = "findings-build"

[[code]]
code = "LIBRARY_FILE_MISSING"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "The library root has no `library.toml` file."
fix = "The library root holds a `library.toml` with `schema`, `name` and `version`. Write: schema = 2"
page = "findings-parts"

[[code]]
code = "MULTILINE_STRING"
severity = "ERROR"
stage = "library load"
who = "consumer"
cause = "A part-file string contains a line break, which the contract forbids."
fix = "A string stays on one line; a line break is written as TOML's escaped `\\n`. Write: description = \"one line\""
page = "findings-build"

[[code]]
code = "PART_DUPLICATE"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "Two part files declare the same `manufacturer` and `mpn` pair."
fix = "Each `manufacturer` and `mpn` pair is declared by one part file only. Write: mpn = \"DEMO-RLY-2CO-24\""
page = "findings-parts"

[[code]]
code = "RATING_TABLE_EMPTY"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A `[rating]`, `[function.rating]` or `[function.operating]` table has no field."
fix = "A rating table holds at least one value, or the table is deleted. Write: voltage = [{{ nom = \"24 V\", at = [\"DC\"] }}]"
page = "findings-parts"

[[code]]
code = "RATING_VALUE_INVALID"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A figure or quantity is not written as schema 2 asks: a quantity is a number, a space and a unit symbol, and a figure an inline table."
fix = "Write each quantity as a string such as \"24 V\", above zero in a rating, and each figure as an inline table. Write: voltage = [{{ nom = \"24 V\", at = [\"DC\"] }}]"
page = "findings-parts"

[[code]]
code = "PART_SCHEMA_OLD"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A part file or `library.toml` is written in schema 1."
fix = "Rewrite each part file and `library.toml` to schema 2 by hand; the guide's parts page lists the schema 2 fields. Write: schema = 2"
page = "findings-parts"

[[code]]
code = "SCHEMA_MIXED"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A part file's `schema` differs from the `schema` in its library's `library.toml`."
fix = "The file's `schema` is the value `library.toml` names, or both change in one commit. Write: schema = 2"
page = "findings-parts"

[[code]]
code = "SCHEMA_UNSUPPORTED"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A `schema` value is not in `SUPPORTED_SCHEMAS`, which today holds only 2."
fix = "The `schema` is an integer in the supported set, only 2 today. Write: schema = 2"
page = "findings-parts"

[[code]]
code = "CABLE_PRODUCT_CORE_COUNT"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A cable product's `core_count` differs from the number of its `core_colours`."
fix = "Make `core_count` equal the number of `core_colours`. Write: core_colours = [\"BN\", \"BU\"]"
page = "findings-parts"

[[code]]
code = "TABLE_UNKNOWN"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "The file has a top-level table that is neither `schema` nor a part-file table the contract names."
fix = "A top-level table is `schema` or a table the part-file contract names. Write: [part]"
page = "findings-parts"

[[code]]
code = "TOML_INVALID"
severity = "ERROR"
stage = "library load"
who = "consumer"
cause = "A part-file is not valid TOML."
fix = "The file is valid TOML: fix the syntax error the message names. Write: name = \"value\""
page = "findings-build"

[[code]]
code = "CHANGEOVER_LINK"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A `switched` link of a `contact_co` function joins two ports whose roles are not `common` with `break` or `make`."
fix = "Each `switched` link of a `contact_co` joins its `common` port to a `break` or `make` port. Write: links = [{{ a = \"11\", b = \"12\", kind = \"switched\" }}]"
page = "findings-parts"

[[code]]
code = "CHANGEOVER_ROLE"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A port of a `contact_co` function has a `role` other than `common`, `break` or `make`."
fix = "A `contact_co` port takes the role `common`, `break` or `make`. Write: role = \"common\""
page = "findings-parts"

[[code]]
code = "CHANGEOVER_SYMBOL_PORT"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A port of a `contact_co` function sets `symbol_port`."
fix = "A `contact_co` port takes no `symbol_port`, since its throw roles bind the drawing. Write: {{ name = \"12\", role = \"break\" }}"
page = "findings-parts"

[[code]]
code = "CONTACT_WITHOUT_SWITCHED_LINK"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A `contact_no`, `contact_nc`, `contact_co` or `switch` function has no `switched` link in its `links`."
fix = "A contact or switch function has a `switched` link joining two of its ports, or a different `kind`. Write: links = [{{ a = \"1\", b = \"2\", kind = \"switched\" }}]"
page = "findings-parts"

[[code]]
code = "PROTECTION_LINK_KIND"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A `switched` link sits on a `protection` function, or a through link's `kind` does not fit its protection `type`."
fix = "A fuse, mcb, motor_breaker or rcd link is `protective`, an overload link is `conductive`, never `switched`. Write: kind = \"protective\""
page = "findings-parts"

[[code]]
code = "PROTECTION_TYPE_ON_NON_PROTECTION"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A function whose `kind` is not `protection` has a `[function.block]` table with a `type`."
fix = "Only a `protection` function has a `[function.block]` table with a `type`. Write: kind = \"protection\""
page = "findings-parts"

[[code]]
code = "PROTECTION_WITHOUT_TYPE"
severity = "WARNING"
stage = "library load"
who = "part author"
cause = "A `protection` function has no `type` in its `[function.block]` table."
fix = "`[function.block]` needs a `type`: fuse, mcb, motor_breaker, overload or rcd. Write: type = \"mcb\""
page = "findings-parts"

[[code]]
code = "REST_DISAGREES_WITH_KIND"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A switched link's `rest` disagrees with its function's `kind`: `contact_no` is open at rest, `contact_nc` is closed."
fix = "`rest` is `open` for `contact_no` and `closed` for `contact_nc`, or change `kind`. Write: rest = \"open\""
page = "findings-parts"

[[code]]
code = "REST_ON_UNSWITCHED_LINK"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A link whose `kind` is not `switched` sets `rest`."
fix = "Only a `switched` link takes `rest`. Write: kind = \"switched\""
page = "findings-parts"

[[code]]
code = "SWITCHED_LINK_WITHOUT_REST"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A `switched` link of a `switch` or `generic` function sets no `rest`."
fix = "A `switched` link of a `switch` or `generic` function states its `rest`. Write: rest = \"open\""
page = "findings-parts"

[[code]]
code = "SYMBOL_REST_MISMATCH"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A function's `symbol` implies a rest state (`make-contact` open; `break-contact` and `emergency-stop` closed), and its switched links, stated or implied by its `kind`, are all at the other one."
fix = "The symbol and the switched links agree on one rest state: make-contact is open, break-contact and emergency-stop are closed. Write: rest = \"open\""
page = "findings-parts"

[[code]]
code = "SYMBOL_TYPE_MISMATCH"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A protection function's `symbol` is a protection symbol that its protection `type` does not take."
fix = "A `fuse` symbol needs `type = \"fuse\"`; `mcb` and `motor_breaker` take `circuit-breaker`, `overload` `thermal-overload`, `rcd` `rcd`. Write: type = \"fuse\""
page = "findings-parts"

[[code]]
code = "CONNECTOR_MARKING_REUSED"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "Two connector functions of one part print the same label, their `marking` or else their `name`."
fix = "Each connector prints its own label, its `marking` or else its `name`. Write: marking = \"X2\""
page = "findings-parts"

[[code]]
code = "ENERGY_ON_NON_POWER"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A function whose `kind` is not `supply` or `load` sets `energy`."
fix = "Only a `supply` or `load` function takes `energy`. Write: kind = \"load\""
page = "findings-parts"

[[code]]
code = "FUNCTION_NAME_DUPLICATE"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "Two `[[function]]` entries of one part have the same `name`."
fix = "Each `[[function]]` has its own `name`. Write: name = \"co_3\""
page = "findings-parts"

[[code]]
code = "FUNCTION_WITHOUT_PORTS"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A `[[function]]` has an empty `ports` list."
fix = "A `[[function]]` lists at least one port in `ports`. Write: ports = [{{ name = \"1\", role = \"generic\" }}]"
page = "findings-parts"

[[code]]
code = "JOIN_INTO_CONNECTOR"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A header pin's `joins` names a port of a `connector` function."
fix = "A header pin `joins` a port of a non-connector function of the same part. Write: joins = \"k1.A1\""
page = "findings-parts"

[[code]]
code = "JOIN_PORT_TWICE"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "Two header pins of one part both `joins` the same function port."
fix = "Each function port is joined by at most one header pin. Write: joins = \"k1.A2\""
page = "findings-parts"

[[code]]
code = "JOIN_PORT_UNKNOWN"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A header pin's `joins` value does not name a port of a function in this part, or is not `<function>.<port>`."
fix = "`joins` is `<function>.<port>`, naming a port of another function of this part. Write: joins = \"k1.A1\""
page = "findings-parts"

[[code]]
code = "LINK_DUPLICATE"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "Two `links` entries of one function join the same pair of ports, in either order."
fix = "Each pair of ports is linked once in a function, in either order. Write: links = [{{ a = \"11\", b = \"12\", kind = \"switched\" }}]"
page = "findings-parts"

[[code]]
code = "LINK_PORT_UNKNOWN"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A `links` entry's `a` or `b` is not a `name` in the function's `ports`."
fix = "Each `a` and `b` names a port listed in `ports`. Write: a = \"11\""
page = "findings-parts"

[[code]]
code = "LINK_SELF"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A `links` entry has the same port as `a` and `b`."
fix = "`a` and `b` name two different ports. Write: b = \"12\""
page = "findings-parts"

[[code]]
code = "PLC_CHANNEL_DUPLICATE"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "Two `[function.plc_channel]` tables of one part have the same `channel` and `signal`."
fix = "Each `[function.plc_channel]` has its own `channel` and `signal`. Write: channel = 4"
page = "findings-parts"

[[code]]
code = "PORT_NAME_DUPLICATE"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "Two ports of one function have the same `name`."
fix = "Each port of one function has its own `name`. Write: name = \"A2\""
page = "findings-parts"

[[code]]
code = "PORT_CONNECTOR_AND_JOIN"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A port names a `connector` pin and a header pin also `joins` it."
fix = "A port has one home at a connector: name it with `connector`, or join it from a header pin, not both. Write: connector = \"j3.1\""
page = "findings-parts"

[[code]]
code = "PORT_NAME_SHARED"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "Two functions of one part give a port the same name, and their printed designations would be the same."
fix = "Each port name is unique across the part, so the printed designations differ. Write: name = \"A3\""
page = "findings-parts"

[[code]]
code = "PORT_PIN_NOT_ON_CONNECTOR"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A port's `connector` is not `<function>.<pin>` of a connector function of this part, or names a pin the connector lacks."
fix = "`connector` names a connector function of this part and one of its pins, `1` to its `poles`. Write: connector = \"j3.1\""
page = "findings-parts"

[[code]]
code = "PORT_PIN_TAKEN"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "Two ports of one part name the same connector pin."
fix = "Each connector pin is named by at most one port. Write: connector = \"j3.2\""
page = "findings-parts"

[[code]]
code = "POWER_LOSS_TWICE"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "`power_loss` is set both in the part's `[rating]` and in a function's `[function.rating]`."
fix = "`power_loss` is stated once, in `[rating]` or in one `[function.rating]`. Write: power_loss = {{ nom = \"2.5 W\" }}"
page = "findings-parts"

[[code]]
code = "SYMBOL_PORT_WITHOUT_SYMBOL"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A port sets `symbol_port`, but its function has no `symbol`."
fix = "A port with `symbol_port` needs its function to have a `symbol`. Write: symbol = \"operating-device\""
page = "findings-parts"

[[code]]
code = "SYMBOL_SLUG"
severity = "ERROR"
stage = "library load"
who = "part author"
cause = "A function's `symbol` is not a lowercase, hyphenated slug."
fix = "`symbol` is lowercase letters and digits joined by single hyphens, such as `change-over-contact`. Write: symbol = \"change-over-contact\""
page = "findings-parts"
