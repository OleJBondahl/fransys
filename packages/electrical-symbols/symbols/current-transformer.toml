schema = 1
name = "Current transformer, general symbol"
kind = "symbol"
status = "unverified"
reference = { standard = "IEC 60617", number = "current-transformer" }

ports = [
  { id = "pri_in",  at = [0, -3], dir = "N", description = "primary conductor, top" },
  { id = "pri_out", at = [0, 3],  dir = "S", description = "primary conductor, bottom" },
  { id = "sec_in",  at = [3, -1], dir = "E", description = "secondary winding, first conductor" },
  { id = "sec_out", at = [3, 1],  dir = "E", description = "secondary winding, second conductor" },
]

paths = [
  { from = "pri_in", to = "pri_out", kind = "conductor" },
  { from = "sec_in", to = "sec_out", kind = "impedance" },
]

elements = [
  { line = [[0, -3], [0, 3]] },
  { circle = [0, 0], r = 1.25, fill = "none" },
  { line = [[0.75, -1], [3, -1]] },
  { line = [[0.75, 1], [3, 1]] },
]

lint_allow = [
  { rule = "through-missing", reason = "the secondary leads leave the ring sideways, so the primary path cannot carry the through flag: a side port on a through symbol fails the repeat(symbol, 3) gate (C8), and the secondary path has both ports on the east side, so it is no series axis with its ports at (0, -a) N and (0, a) S" },
]

[slots]
tag               = { at = [-1.75, 0],  side = "W", box = [6, 1] }
"marking.pri_in"  = { at = [0.25, -2.5], side = "E", box = [1.5, 1] }
"marking.pri_out" = { at = [0.25, 2.5],  side = "E", box = [1.5, 1] }
"marking.sec_in"  = { at = [3, -2],      side = "E", box = [1.5, 1] }
"marking.sec_out" = { at = [3, 2],       side = "E", box = [1.5, 1] }
