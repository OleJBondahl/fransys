[layout]
step = 8
pad = 2
margin = [16, 16]
wire_min = 8
column_gap_min = 8
parallel_pitch = 48  # G between the axes of two parallel branches
row_gap = 24
box_pin_pitch_min = 16
box_pins = "spread"
short_height = 0.4
min_fill = 0.25
exact_order_limit = 12
exact_order_nodes = 50000
tag_stagger = true
pin_pairs = [["N", "S"]]
w_tag = 1.0
w_arrow = 0.5
w_ref = 3.0
w_p = 2.0
w_f = 1.0
w_row = 0.05
w_violation = 1000000.0
bend_penalty = 19
crossing_penalty = 64
box_margin = 16
column_wire_lanes = 3
jog_lanes = 2
spare_cells = 3
reroute_rounds = 3
share_penalty = 64
history_step = 16
ripup_worst = 3
recut_rounds = 3
# digit rises of a where-text page number the recut follows (R1883)
where_digit_rounds = 2
# standing labels a blocked label may move to their next free candidates before the recut (R1479)
label_moves = 2
route_fallback_rounds = 10
solve_rounds = 3
# widen passes before it raises: grants only grow, so a pass past this is a loop (R1981)
widen_rounds_limit = 50
corner_order = ["TL", "BL", "TR", "BR"]
cells = [8, 6]
label_gap = 8
open_stub = 0
box_columns = true
top_headroom_lanes = 3
bottom_headroom_lanes = 1
end_bias_weight = 3
anchor_weight = 1000000
boxpin_weight = 6

# The house numbers of the layout rules (HouseProfile): no unit's profile sets them.
[profile]
marker_padding = 2
route_turn_penalty = 4
route_crossing_penalty = 16
